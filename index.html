<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M7 Group — Service Desk</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Montserrat+Alternates:wght@700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface2: #1c1c1c;
      --surface3: #262626;
      --border: #2e2622;
      --accent: #e6401b;
      --accent2: #ff5a2c;
      --accent-glow: rgba(230,64,27,0.18);
      --m7red: #e6401b;
      --m7red-glow: rgba(230,64,27,0.18);
      --text: #f0ece8;
      --muted: #8a8178;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
      --info: #ff8c5a;
      --radius: 12px;
      --radius-sm: 8px;
      --font-head: 'Montserrat Alternates', 'Montserrat', sans-serif;
      --font-body: 'Montserrat', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 14px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #root { display: flex; min-height: 100vh; }

    /* SCROLLBAR */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    /* SIDEBAR */
    .sidebar {
      width: 230px;
      min-height: 100vh;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 100;
      transition: transform 0.3s;
    }

    .sidebar-logo {
      padding: 24px 20px 20px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-logo h1 {
      font-family: var(--font-head);
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, #e6401b, #ff6b42);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    .sidebar-logo span { font-size: 11px; color: var(--muted); font-weight: 300; display: block; margin-top: 2px; }

    .sidebar-nav { flex: 1; padding: 16px 10px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }

    .nav-section { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); padding: 12px 10px 6px; }

    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--muted);
      font-weight: 400;
      transition: all 0.15s;
      position: relative;
      font-size: 13.5px;
    }
    .nav-item:hover { background: var(--surface2); color: var(--text); }
    .nav-item.active { background: var(--accent-glow); color: var(--accent); font-weight: 500; }
    .nav-item.active::before {
      content: '';
      position: absolute; left: 0; top: 20%; bottom: 20%;
      width: 3px; background: var(--accent);
      border-radius: 0 2px 2px 0;
    }
    .nav-item .icon { width: 18px; text-align: center; font-size: 16px; flex-shrink: 0; }
    .badge {
      margin-left: auto;
      background: var(--accent);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 99px;
      min-width: 20px;
      text-align: center;
    }
    .badge.warn { background: var(--warning); color: #000; }
    .badge.danger { background: var(--danger); }

    .sidebar-footer {
      padding: 16px 10px;
      border-top: 1px solid var(--border);
    }
    .user-card {
      display: flex; align-items: center; gap: 10px;
      padding: 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
    }
    .user-card:hover { background: var(--surface2); }
    .avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e6401b, #ff5a2c);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 13px; color: #fff; flex-shrink: 0;
    }
    .user-info { flex: 1; min-width: 0; }
    .user-name { font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-role { font-size: 11px; color: var(--muted); }

    /* MAIN */
    .main {
      margin-left: 230px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .topbar {
      height: 60px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 16px;
      padding: 0 28px;
      position: sticky; top: 0; z-index: 50;
    }
    .topbar-title {
      font-family: var(--font-head);
      font-size: 18px;
      font-weight: 700;
      flex: 1;
    }
    .search-bar {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 14px 7px 36px;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 13px;
      width: 240px;
      outline: none;
      transition: border-color 0.15s;
      position: relative;
    }
    .search-bar:focus { border-color: var(--accent); }
    .search-wrap { position: relative; }
    .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; pointer-events: none; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #3d6ef0; box-shadow: 0 0 16px var(--accent-glow); }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--surface2); color: var(--text); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-sm { padding: 5px 11px; font-size: 12px; }

    .page { padding: 28px; flex: 1; }

    /* CARDS */
    .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.15s;
    }
    .stat-card:hover { border-color: var(--accent); }
    .stat-card::after {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: var(--card-accent, var(--accent));
    }
    .stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px; }
    .stat-value { font-family: var(--font-head); font-size: 32px; font-weight: 800; line-height: 1; }
    .stat-sub { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .stat-icon { position: absolute; right: 16px; top: 16px; font-size: 28px; opacity: 0.12; }

    /* TICKET TABLE */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .card-header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px;
    }
    .card-title { font-family: var(--font-head); font-size: 15px; font-weight: 700; flex: 1; }

    table { width: 100%; border-collapse: collapse; }
    thead th {
      text-align: left;
      padding: 12px 16px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
    }
    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
      cursor: pointer;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface2); }
    tbody td { padding: 13px 16px; font-size: 13px; vertical-align: middle; }

    /* BADGES */
    .tag {
      display: inline-flex; align-items: center;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 600;
    }
    .tag-open { background: rgba(230,64,27,0.15); color: var(--accent); }
    .tag-pending { background: rgba(251,191,36,0.15); color: var(--warning); }
    .tag-resolved { background: rgba(52,211,153,0.15); color: var(--success); }
    .tag-closed { background: rgba(107,113,148,0.15); color: var(--muted); }
    .tag-cancelled { background: rgba(248,113,113,0.15); color: var(--danger); }
    .tag-urgent { background: rgba(248,113,113,0.18); color: var(--danger); }
    .tag-awaiting_approval { background: rgba(255,157,92,0.18); color: #ff9d5c; }
    .tag-approved { background: rgba(52,211,153,0.15); color: var(--success); }
    .tag-rejected { background: rgba(248,113,113,0.18); color: var(--danger); }

    /* APPROVAL BANNER */
    .approval-banner {
      border-radius: var(--radius);
      padding: 18px 22px;
      display: flex; align-items: center; gap: 16px;
      margin-bottom: 4px;
    }
    .approval-banner.needs { background: rgba(255,157,92,0.1); border: 1px solid rgba(255,157,92,0.3); }
    .approval-banner.approved { background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.3); }
    .approval-banner.rejected { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); }
    .approval-icon { font-size: 28px; }
    .approval-text { flex: 1; }
    .approval-title { font-weight: 700; font-size: 14px; margin-bottom: 3px; }
    .approval-sub { font-size: 12px; color: var(--muted); }

    .prio { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .prio-low { background: var(--success); }
    .prio-medium { background: var(--warning); }
    .prio-high { background: var(--danger); }
    .prio-critical { background: #ff4466; box-shadow: 0 0 8px #ff4466; }

    /* MODAL */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      animation: fadeIn 0.15s;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; } }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 580px;
      max-height: 90vh;
      overflow-y: auto;
      animation: slideUp 0.2s;
    }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } }
    .modal-header {
      padding: 24px 28px 18px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px;
    }
    .modal-title { font-family: var(--font-head); font-size: 18px; font-weight: 700; flex: 1; }
    .modal-body { padding: 24px 28px; display: flex; flex-direction: column; gap: 18px; }
    .modal-footer { padding: 18px 28px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }

    /* FORM */
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.7px; color: var(--muted); }
    .form-input, .form-select, .form-textarea {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 13.5px;
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
    .form-select option { background: var(--surface2); }
    .form-textarea { resize: vertical; min-height: 100px; line-height: 1.6; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    /* QUEUE VIEW */
    .queue-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .queue-col {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .queue-col-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 13px;
      display: flex; align-items: center; gap: 8px;
    }
    .queue-col-body { padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 400px; }
    .queue-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .queue-card:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
    .queue-card-id { font-size: 10px; color: var(--muted); margin-bottom: 6px; }
    .queue-card-title { font-size: 13px; font-weight: 500; margin-bottom: 8px; line-height: 1.4; }
    .queue-card-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

    /* SETTINGS */
    .settings-grid { display: grid; grid-template-columns: 220px 1fr; gap: 24px; }
    .settings-nav { display: flex; flex-direction: column; gap: 2px; }
    .settings-nav-item {
      padding: 9px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 13px;
      color: var(--muted);
      transition: all 0.15s;
    }
    .settings-nav-item:hover { background: var(--surface2); color: var(--text); }
    .settings-nav-item.active { background: var(--accent-glow); color: var(--accent); font-weight: 500; }
    .settings-panel { display: flex; flex-direction: column; gap: 20px; }
    .settings-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .settings-section-title {
      padding: 16px 22px;
      border-bottom: 1px solid var(--border);
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 14px;
    }
    .settings-row {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 16px;
    }
    .settings-row:last-child { border-bottom: none; }
    .settings-row-info { flex: 1; }
    .settings-row-label { font-weight: 500; font-size: 13.5px; margin-bottom: 3px; }
    .settings-row-desc { font-size: 12px; color: var(--muted); line-height: 1.5; }

    /* TOGGLE */
    .toggle {
      width: 40px; height: 22px;
      background: var(--border);
      border-radius: 99px;
      cursor: pointer;
      position: relative;
      transition: background 0.2s;
      flex-shrink: 0;
      border: none;
    }
    .toggle.on { background: var(--accent); }
    .toggle::after {
      content: '';
      position: absolute;
      width: 16px; height: 16px;
      background: #fff;
      border-radius: 50%;
      top: 3px; left: 3px;
      transition: transform 0.2s;
    }
    .toggle.on::after { transform: translateX(18px); }

    /* TICKET DETAIL */
    .ticket-detail { display: grid; grid-template-columns: 1fr 280px; gap: 20px; }
    .ticket-main { display: flex; flex-direction: column; gap: 16px; }
    .ticket-sidebar-panel { display: flex; flex-direction: column; gap: 14px; }
    .info-block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
    }
    .info-block-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-bottom: 14px; }
    .info-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .info-row:last-child { border-bottom: none; }
    .info-row-label { color: var(--muted); }
    .info-row-value { font-weight: 500; }

    .comment {
      background: var(--surface2);
      border-radius: var(--radius-sm);
      padding: 14px;
      border-left: 3px solid var(--accent);
    }
    .comment-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .comment-author { font-weight: 600; font-size: 13px; }
    .comment-date { font-size: 11px; color: var(--muted); }
    .comment-body { font-size: 13.5px; line-height: 1.6; color: var(--text); }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-state-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
    .empty-state-text { font-size: 15px; margin-bottom: 6px; color: var(--text); font-weight: 500; }
    .empty-state-sub { font-size: 13px; }

    .chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 600;
      background: var(--surface3);
      color: var(--muted);
    }

    /* APPROVAL BANNERS */
    .approval-banner {
      display: flex; align-items: flex-start; gap: 14px;
      padding: 16px 20px;
      border-radius: var(--radius);
      border: 1px solid;
    }
    .approval-banner.needs { background: rgba(255,157,92,0.08); border-color: rgba(255,157,92,0.35); }
    .approval-banner.approved { background: rgba(52,211,153,0.08); border-color: rgba(52,211,153,0.35); }
    .approval-banner.rejected { background: rgba(248,113,113,0.08); border-color: rgba(248,113,113,0.35); }
    .approval-icon { font-size: 22px; flex-shrink: 0; margin-top: 1px; }
    .approval-title { font-weight: 700; font-size: 14px; margin-bottom: 3px; }
    .approval-sub { font-size: 12.5px; color: var(--muted); line-height: 1.5; }

    .tag-approved { background: rgba(52,211,153,0.15); color: var(--success); }
    .tag-rejected { background: rgba(248,113,113,0.15); color: var(--danger); }
    .tag-awaiting_approval { background: rgba(255,157,92,0.15); color: #ff9d5c; }

    /* LOGIN PAGE — M7 ORANGE/BLACK CENTERED */
    .login-page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      position: relative;
      overflow: hidden;
      padding: 24px;
    }
    .login-page::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 70% 55% at 50% 20%, rgba(230,64,27,0.18) 0%, transparent 55%),
        radial-gradient(ellipse 90% 60% at 50% 100%, rgba(230,64,27,0.10) 0%, transparent 60%);
      pointer-events: none;
    }
    .login-page::after {
      content: '';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(230,64,27,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(230,64,27,0.035) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, #000 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, #000 30%, transparent 75%);
      pointer-events: none;
    }

    .login-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background: linear-gradient(180deg, rgba(20,20,20,0.9) 0%, rgba(12,12,12,0.95) 100%);
      border: 1px solid rgba(230,64,27,0.18);
      border-radius: 24px;
      padding: 48px 44px 40px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.02),
        0 20px 60px rgba(0,0,0,0.6),
        0 0 80px rgba(230,64,27,0.08);
      animation: slideUp 0.4s cubic-bezier(0.16,1,0.3,1);
    }
    .login-card::before {
      content: '';
      position: absolute; top: 0; left: 50%;
      transform: translateX(-50%);
      width: 60%; height: 2px;
      background: linear-gradient(90deg, transparent, #e6401b, transparent);
      border-radius: 2px;
    }

    .login-logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 32px;
    }
    .login-logo-wrap img {
      width: 240px;
      max-width: 100%;
      height: auto;
      filter: drop-shadow(0 4px 20px rgba(230,64,27,0.25));
    }
    .login-logo-fallback {
      font-family: var(--font-head);
      font-size: 42px; font-weight: 900;
      color: #fff;
      letter-spacing: 2px;
    }
    .login-logo-fallback span { color: #e6401b; }

    .login-tagline {
      text-align: center;
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      margin-bottom: 36px;
      letter-spacing: 0.3px;
    }

    .login-card-title {

const { useState, useEffect, useRef, useCallback } = React;

// ─── SUPABASE ────────────────────────────────────────────────────
const SUPA_URL = 'https://dgtxlynmfajfmniegeqw.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRndHhseW5tZmFqZm1uaWVnZXF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwOTAwNjYsImV4cCI6MjA5MTY2NjA2Nn0.H4P6dSz0Wx0rmNVVfN37sNPRgcbzqstkjtUyAqS4MP4';

const supa = {
  async query(table, opts = {}) {
    let url = `${SUPA_URL}/rest/v1/${table}?`;
    if (opts.select)  url += `select=${encodeURIComponent(opts.select)}&`;
    if (opts.filter)  url += `${opts.filter}&`;
    if (opts.order)   url += `order=${opts.order}&`;
    const res = await fetch(url, { headers: { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}`, 'Content-Type': 'application/json' } });
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  },
  async insert(table, data) {
    const res = await fetch(`${SUPA_URL}/rest/v1/${table}`, {
      method: 'POST',
      headers: { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}`, 'Content-Type': 'application/json', Prefer: 'return=representation' },
      body: JSON.stringify(data),
    });
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  },
  async update(table, filter, data) {
    const res = await fetch(`${SUPA_URL}/rest/v1/${table}?${filter}`, {
      method: 'PATCH',
      headers: { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}`, 'Content-Type': 'application/json', Prefer: 'return=representation' },
      body: JSON.stringify(data),
    });
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  },
  async delete(table, filter) {
    const res = await fetch(`${SUPA_URL}/rest/v1/${table}?${filter}`, {
      method: 'DELETE',
      headers: { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}` },
    });
    if (!res.ok) throw new Error(await res.text());
    return true;
  },
  // Upload de arquivo para o Storage bucket "anexos"
  async uploadFile(file, ticketId) {
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
    const path = `${ticketId}/${Date.now()}_${safeName}`;
    const res = await fetch(`${SUPA_URL}/storage/v1/object/anexos/${path}`, {
      method: 'POST',
      headers: { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}`, 'Content-Type': file.type || 'application/octet-stream' },
      body: file,
    });

      name: file.name,

  },
};

// ─── HELPERS ─────────────────────────────────────────────────────
function genId(prefix) { return `${prefix}-${Date.now().toString(36).toUpperCase()}`; }

// Resolve a cadeia de aprovação subindo pela hierarquia de gerentes.
// requesterEmail: e-mail de quem abriu; levels: quantos níveis a fila exige.
// Retorna array de { level, approverId, approverName, status }.
function resolveApprovalChain(requesterEmail, levels, usersList) {
  const chain = [];
  if (!requesterEmail || !levels || levels < 1) return chain;
  // Acha o usuário solicitante pelo e-mail
  let current = usersList.find(u => u.email && u.email.toLowerCase() === requesterEmail.toLowerCase());
  const seen = new Set();
  for (let lvl = 1; lvl <= levels; lvl++) {
    if (!current || !current.managerId) break; // acabou a cadeia
    if (seen.has(current.managerId)) break;    // proteção contra loop
    seen.add(current.managerId);
    const mgr = usersList.find(u => u.id === current.managerId);
    if (!mgr) break;
    chain.push({ level: lvl, approverId: mgr.id, approverName: mgr.name, status: 'pending', note: '' });
    current = mgr; // sobe um nível
  }
  return chain;
}

// Resolve um fluxo PERSONALIZADO combinando etapas de gestor e aprovadores fixos.
// flow: array de { type:'manager' } | { type:'fixed', approverId, approverName }
// As etapas de 'manager' sobem pela hierarquia do solicitante, uma de cada vez.
function resolveCustomFlow(requesterEmail, flow, usersList) {
  const chain = [];
  if (!Array.isArray(flow) || flow.length === 0) return chain;
  // ponto de partida para as etapas de gestor
  let current = usersList.find(u => u.email && u.email.toLowerCase() === requesterEmail.toLowerCase());
  const seenMgr = new Set();
  let lvl = 0;
  for (const step of flow) {
    lvl++;
    if (step.type === 'fixed' && step.approverId) {
      const u = usersList.find(x => x.id === step.approverId);
      if (u) {
        chain.push({ level: lvl, approverId: u.id, approverName: u.name, status: 'pending', note: '', kind: 'fixed' });
      }
      // etapa fixa não altera o "current" da cadeia de gestores
    } else if (step.type === 'manager') {
      if (current && current.managerId && !seenMgr.has(current.managerId)) {
        seenMgr.add(current.managerId);
        const mgr = usersList.find(u => u.id === current.managerId);
        if (mgr) {
          chain.push({ level: lvl, approverId: mgr.id, approverName: mgr.name, status: 'pending', note: '', kind: 'manager' });
          current = mgr;
        }
      }
      // se não há gestor, a etapa de gestor é simplesmente pulada
    }
  }
  return chain;
}

function fmtDate(d) { if (!d) return '—'; return new Date(d).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); }
function fmtDateShort(d) { if (!d) return '—'; return new Date(d).toLocaleDateString('pt-BR'); }

const STATUS_LABELS    = { open: 'Aberto', pending: 'Em Andamento', awaiting_approval: 'Ag. Aprovação', resolved: 'Resolvido', closed: 'Fechado', cancelled: 'Cancelado' };

// Mapeia snake_case do banco → camelCase do front
function mapTicket(t) {
  return {
    id: t.id, title: t.title, desc: t.description, queue: t.queue,

    checklist: t.checklist || [],
    created: t.created_at, updated: t.updated_at,

}
function mapUser(u) {
  return {
    id: u.id, name: u.name, email: u.email, password: u.password,

function mapProcedure(p) {

function mapQueue(q) {

    id: q.id, name: q.name, color: q.color, sla: q.sla,

}
function mapArea(a) {
  return { id: a.id, name: a.name, description: a.description || '', color: a.color || '#e6401b' };
}
function mapSettings(s) {

    companyName: s.company_name, supportEmail: s.support_email,

    ejsTicketTpl: s.ejs_ticket_tpl || '', ejsStatusTpl: s.ejs_status_tpl || '',
    ejsUserTpl: s.ejs_user_tpl || '', ejsApprovalTpl: s.ejs_approval_tpl || '',
    ejsEnabled: s.ejs_enabled || false,

// ─── EMAIL HELPER ─────────────────────────────────────────────────
function sendEmail(settings, templateId, params) {
  if (!settings.ejsEnabled || !settings.ejsPublicKey || !settings.ejsServiceId || !templateId) return;
  try {
    emailjs.init({ publicKey: settings.ejsPublicKey });
    emailjs.send(settings.ejsServiceId, templateId, {
      app_name: settings.appName || 'DeskFlow',
      company: settings.companyName,
      support_email: settings.supportEmail,
      ...params,
    }).catch(err => console.warn('EmailJS error:', err));
  } catch(e) { console.warn('EmailJS not ready:', e); }
}

// ─── TOAST ───────────────────────────────────────────────────────
function useToast() {
  const [toasts, setToasts] = useState([]);
  const show = useCallback((msg, type = 'success') => {
    const id = Date.now();
    setToasts(t => [...t, { id, msg, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3500);
  }, []);
  const ToastContainer = () => (
    <div className="toast-wrap">
      {toasts.map(t => (
        <div key={t.id} className={`toast ${t.type}`}>
          <span>{t.type === 'success' ? '✓' : '✕'}</span>{t.msg}
        </div>
      ))}
    </div>
  );
  return { show, ToastContainer };
}

// ─── ERROR SCREEN ─────────────────────────────────────────────────
function ErrorScreen({ message, onRetry }) {
  return (
    <div style={{ minHeight:'100vh', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', background:'var(--bg)', gap:16 }}>
      <div style={{ fontSize:48 }}>⚠</div>
      <div style={{ fontFamily:'var(--font-head)', fontSize:20, color:'var(--danger)' }}>Erro de conexão</div>
      <div style={{ fontSize:14, color:'var(--muted)', maxWidth:400, textAlign:'center', lineHeight:1.6 }}>{message}</div>
      <button className="btn btn-primary" onClick={onRetry}>Tentar novamente</button>
    </div>
  );
}

// ─── LOGIN PAGE ───────────────────────────────────────────────────
function LoginPage({ onLogin, logoUrl, appName, users }) {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);
  const [showPass, setShowPass] = useState(false);
  const userList = users || [];

  const handleLogin = () => {
    setError('');
    if (!email || !password) { setError('Preencha e-mail e senha.'); return; }
    setLoading(true);
    const user = userList.find(u => u.email.toLowerCase() === email.toLowerCase() && u.password === password);
    if (user) {
      if (user.active === false) { setError('Esta conta está desativada. Contate o administrador.'); setLoading(false); return; }
      onLogin(user);
    } else {
      setError('E-mail ou senha incorretos.');
      setLoading(false);
    }
  };

  return (
    <div className="login-page">
      <div className="login-card">
        <div className="login-logo-wrap">
          <img src="logo-m7.png" alt="M7 Group" onError={(e) => { e.target.style.display='none'; e.target.insertAdjacentHTML('afterend', '<div class=\"login-logo-fallback\">M<span>7</span></div>'); }} />
        </div>

        {loading ? (
          <div style={{ textAlign:'center', padding:'40px 0' }}>
            <div style={{ width:40, height:40, border:'3px solid rgba(255,255,255,0.1)', borderTopColor:'#e6401b', borderRadius:'50%', animation:'spin 0.8s linear infinite', margin:'0 auto 16px' }} />
            <div style={{ color:'rgba(255,255,255,0.5)' }}>Entrando...</div>
          </div>
        ) : (
          <>
            <div className="login-card-title">Bem-vindo de volta</div>
            <div className="login-card-sub">Acesse o portal de suporte M7 Group</div>
            <div className="login-form">
              {error && <div className="login-error">⚠ {error}</div>}
              <div className="form-group">
                <label className="form-label">E-mail</label>
                <input className="form-input" type="email" placeholder="seu@m7groupbr.com" value={email} onChange={e => setEmail(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleLogin()} autoFocus />
              </div>
              <div className="form-group">
                <label className="form-label">Senha</label>
                <div style={{position:'relative'}}>
                  <input className="form-input" type={showPass ? 'text' : 'password'} placeholder="••••••••" value={password} onChange={e => setPassword(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleLogin()} style={{paddingRight:42}} />
                  <button onClick={() => setShowPass(v => !v)} style={{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',cursor:'pointer',color:'rgba(255,255,255,0.4)',fontSize:15}}>{showPass ? '🙈' : '👁'}</button>
                </div>
              </div>
              <button className="btn login-btn-m7" style={{width:'100%',justifyContent:'center',height:48,fontSize:15,marginTop:4}} onClick={handleLogin}>Entrar</button>
            </div>
          </>
        )}
        <div className="login-footer-m7">© 2026 M7 Group · Service Desk</div>
      </div>
    </div>
  );
}

// ─── APP ─────────────────────────────────────────────────────────
function App() {
  const [appState, setAppState] = useState('loading'); // loading | error | login | app
  const [dbError, setDbError] = useState('');
  const [currentUser, setCurrentUser] = useState(null);

  // dados do banco
  const [users,     setUsers]     = useState([]);
  const [queues,    setQueues]    = useState([]);
  const [areas,     setAreas]     = useState([]);
  const [procedures, setProcedures] = useState([]);
  const [tickets,   setTickets]   = useState([]);
  const [settings,  setSettings]  = useState({});

  // Aprovadores são derivados dos usuários com perfil "aprovador" — fonte única de verdade
  const approvers = users
    .filter(u => u.role === 'approver')
    .map(u => ({ id: u.approverId || u.id, name: u.name, email: u.email, active: u.active !== false, userId: u.id }));

  // Agentes são derivados dos usuários com perfil "agente" — fonte única de verdade
  const agents = users
    .filter(u => u.role === 'agent')
    .map(u => ({ id: u.agentId || u.id, name: u.name, email: u.email, queue: u.queueId || null, queueIds: u.queueIds || [], area: u.areaId || null, active: u.active !== false, userId: u.id }));

  // Elegíveis a aprovar num fluxo fixo: aprovadores E agentes (usa o id do USUÁRIO como referência)
  const eligibleApprovers = users
    .filter(u => (u.role === 'approver' || u.role === 'agent' || u.role === 'admin') && u.active !== false)
    .map(u => ({ id: u.id, name: u.name, email: u.email, role: u.role }))
    .sort((a,b) => a.name.localeCompare(b.name,'pt-BR'));

  // UI state
  const [page,          setPage]          = useState('dashboard');
  const [selectedTicket,setSelectedTicket]= useState(null);
  const [showNewTicket, setShowNewTicket] = useState(false);
  const [search,        setSearch]        = useState('');
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
  const { show, ToastContainer } = useToast();

  // ── carrega tudo do banco ──
  const loadAll = useCallback(async () => {
    setAppState('loading');
    try {
      const [uRows, qRows, tRows, sRows, cRows, arRows, prRows] = await Promise.all([
        supa.query('users',    { order: 'created_at.asc' }),
        supa.query('queues',   { order: 'created_at.asc' }),
        supa.query('tickets',  { select: '*', order: 'created_at.desc' }),
        supa.query('settings', { filter: 'id=eq.1' }),
        supa.query('comments', { order: 'created_at.asc' }),
        supa.query('areas',    { order: 'created_at.asc' }).catch(() => []),
        supa.query('procedures', { order: 'created_at.desc' }).catch(() => []),
      ]);

      // agrupa comentários por ticket
      const commentsByTicket = {};
      (cRows || []).forEach(c => {
        if (!commentsByTicket[c.ticket_id]) commentsByTicket[c.ticket_id] = [];
        commentsByTicket[c.ticket_id].push({ author: c.author, date: c.created_at, text: c.body, attachments: c.attachments || [] });
      });

      const mappedUsers = (uRows || []).map(mapUser);
      setUsers(    mappedUsers);
      setQueues(   (qRows  || []).map(mapQueue));
      setAreas(    (arRows || []).map(mapArea));
      setProcedures((prRows || []).map(mapProcedure));
      setTickets(  (tRows  || []).map(t => ({ ...mapTicket(t), comments: commentsByTicket[t.id] || [] })));
      setSettings( mapSettings(sRows?.[0] || {}));

      // Restaura sessão salva, se houver
      let restored = false;
      try {
        const savedId = localStorage.getItem('m7sd_session');
        if (savedId) {
          const u = mappedUsers.find(x => x.id === savedId);
          if (u && u.active !== false) {
            setCurrentUser(u);
            setAppState('app');
            restored = true;
          } else {
            localStorage.removeItem('m7sd_session');
          }
        }
      } catch(e) {}
      if (!restored) setAppState('login');
    } catch(e) {
      console.error(e);
      setDbError(e.message || 'Não foi possível conectar ao banco de dados.');
      setAppState('error');
    }
  }, []);

  useEffect(() => { loadAll(); }, [loadAll]);

  // Guard: redireciona não-admins para tickets se tentarem acessar página restrita
  useEffect(() => {
    if (!currentUser) return;
    const adminOnly = ['agents','users','settings'];
    const approverPages = ['dashboard','tickets','approvals','ticket-detail'];
    if (currentUser.role === 'agent' && adminOnly.includes(page)) setPage('tickets');
    if (currentUser.role === 'approver' && !approverPages.includes(page) && page !== 'queues') {
      if (adminOnly.includes(page)) setPage('approvals');
    }
  }, [page, currentUser]);

  // ── handlers ──
  const handleLogin  = (user) => {
    setCurrentUser(user);
    setAppState('app');
    try { localStorage.setItem('m7sd_session', user.id); } catch(e) {}
    show(`Bem-vindo, ${user.name.split(' ')[0]}!`);
  };
  const handleLogout = () => {
    setCurrentUser(null);
    setAppState('login');
    setPage('dashboard');
    setSelectedTicket(null);
    try { localStorage.removeItem('m7sd_session'); } catch(e) {}
  };
  const openTicket   = (t) => { setSelectedTicket(t); setPage('ticket-detail'); };

  const updateTicket = async (id, patch) => {
    const dbPatch = {};
    if (patch.status        !== undefined) dbPatch.status         = patch.status;
    if (patch.priority      !== undefined) dbPatch.priority        = patch.priority;
    if (patch.agent         !== undefined) dbPatch.agent           = patch.agent || null;
    if (patch.queue         !== undefined) dbPatch.queue           = patch.queue;
    if (patch.approvalStatus!== undefined) dbPatch.approval_status = patch.approvalStatus;
    if (patch.approvedBy    !== undefined) dbPatch.approved_by     = patch.approvedBy;
    if (patch.approvalNote  !== undefined) dbPatch.approval_note   = patch.approvalNote;
    if (patch.approvalLevel !== undefined) dbPatch.approval_level  = patch.approvalLevel;
    if (patch.approvedBy2   !== undefined) dbPatch.approved_by2    = patch.approvedBy2;
    if (patch.approvalNote2 !== undefined) dbPatch.approval_note2  = patch.approvalNote2;
    if (patch.approvalChain !== undefined) dbPatch.approval_chain  = patch.approvalChain;
    if (patch.currentApprover!== undefined) dbPatch.current_approver = patch.currentApprover;

    // e-mail mudança de status
    if (patch.status) {
      const tk = tickets.find(t => t.id === id);
      if (tk && patch.status !== tk.status && settings.ejsStatusTpl) {
        const ag = agents.find(a => a.id === (patch.agent !== undefined ? patch.agent : tk.agent));
        sendEmail(settings, settings.ejsStatusTpl, {
          to_email: tk.requester, to_name: tk.requester.split('@')[0],
          ticket_id: tk.id, ticket_title: tk.title,
          old_status: STATUS_LABELS[tk.status], new_status: STATUS_LABELS[patch.status],
          agent_name: ag?.name || 'Não atribuído',
        });
      }
    }

    try {
      await supa.update('tickets', `id=eq.${id}`, dbPatch);
      setTickets(ts => ts.map(t => t.id === id ? { ...t, ...patch, updated: new Date().toISOString() } : t));
      if (selectedTicket?.id === id) setSelectedTicket(t => ({ ...t, ...patch }));
      show('Ticket atualizado!');
    } catch(e) { show('Erro ao atualizar ticket: ' + e.message, 'error'); }
  };

  const addTicket = async (data) => {
    const q = queues.find(q => q.id === data.queue);
    const id = genId('TK');

    // Monta a cadeia de aprovação
    let chain = [];
    if (q?.requiresApproval) {
      if (Array.isArray(q.approvalFlow) && q.approvalFlow.length > 0) {
        // Fluxo personalizado (gestor + fixos combinados)
        chain = resolveCustomFlow(data.requester, q.approvalFlow, users);
      } else {
        // Modelo padrão: cadeia de gestores
        const levels = q.approvalLevels || 1;
        chain = resolveApprovalChain(data.requester, levels, users);
      }
    }
    // Se a fila exige aprovação MAS a cadeia ficou vazia (sem gerente) → aprova automático
    const needsApproval = chain.length > 0;

    // Upload dos anexos primeiro (se houver)
    let attachments = [];
    if (data.files && data.files.length > 0) {
      try {
        for (const file of data.files) {
          const meta = await supa.uploadFile(file, id);
          attachments.push(meta);
        }
      } catch(e) {
        show('Erro ao enviar anexo: ' + e.message, 'error');
        // continua criando o ticket mesmo se o anexo falhar
      }
    }

    const dbRow = {
      id, title: data.title, description: data.desc || '',
      queue: data.queue, status: needsApproval ? 'awaiting_approval' : 'open',
      priority: data.priority, agent: data.agent || null,
      requester: data.requester,
      approval_status: needsApproval ? 'pending' : null,
      approval_level: needsApproval ? 1 : null,
      approval_chain: chain,
      current_approver: needsApproval ? chain[0].approverId : null,
      attachments: attachments,
      checklist: data.checklist || [],
    };
    try {
      await supa.insert('tickets', dbRow);
      const newTicket = { ...mapTicket({ ...dbRow, created_at: new Date().toISOString(), updated_at: new Date().toISOString() }), comments: [] };
      setTickets(ts => [newTicket, ...ts]);
      if (settings.ejsTicketTpl) {
        const ag = agents.find(a => a.id === data.agent);
        sendEmail(settings, settings.ejsTicketTpl, {
          to_email: data.requester, to_name: data.requester.split('@')[0],
          ticket_id: id, ticket_title: data.title, ticket_desc: data.desc || '',
          queue_name: q?.name || '', priority: PRIO_LABELS[data.priority] || data.priority,
          status: STATUS_LABELS[newTicket.status], agent_name: ag?.name || 'Não atribuído',
        });
      }
      const firstApprover = needsApproval ? users.find(u => u.id === chain[0].approverId) : null;
      show(needsApproval
        ? `Ticket criado — aguardando aprovação de ${firstApprover?.name || 'gestor'}!`
        : (q?.requiresApproval ? 'Ticket criado e aprovado automaticamente (sem aprovadores na cadeia).' : 'Ticket criado com sucesso!'));
    } catch(e) { show('Erro ao criar ticket: ' + e.message, 'error'); }
  };

  const addComment = async (ticketId, text, files) => {
    const author = currentUser?.name || 'Anônimo';
    try {
      // Upload de anexos do comentário, se houver
      let attachments = [];
      if (files && files.length > 0) {
        for (const file of files) {
          const meta = await supa.uploadFile(file, ticketId);
          attachments.push(meta);
        }
      }
      await supa.insert('comments', { ticket_id: ticketId, author, body: text, attachments });
      const comment = { author, date: new Date().toISOString(), text, attachments };
      setTickets(ts => ts.map(t => t.id === ticketId ? { ...t, comments: [...t.comments, comment], updated: new Date().toISOString() } : t));
      if (selectedTicket?.id === ticketId) setSelectedTicket(t => ({ ...t, comments: [...t.comments, comment] }));
      show('Comentário adicionado!');
      return true;
    } catch(e) { show('Erro ao comentar: ' + e.message, 'error'); return false; }
  };

  // Transferência de chamado: muda fila/agente e registra como comentário do sistema
  const transferTicket = async (ticket, { queue: newQueueId, agent: newAgentId, reason }) => {
    const fromQueue = queues.find(q => q.id === ticket.queue);
    const toQueue = queues.find(q => q.id === newQueueId);
    const fromAgent = agents.find(a => a.id === ticket.agent);
    const toAgent = newAgentId ? agents.find(a => a.id === newAgentId) : null;
    const author = currentUser?.name || 'Sistema';

    // monta o texto do registro de transferência
    const parts = [];
    if (newQueueId !== ticket.queue) {
      parts.push(`Fila: ${fromQueue?.name || '—'} → ${toQueue?.name || '—'}`);
    }
    if ((newAgentId||null) !== (ticket.agent||null)) {
      parts.push(`Agente: ${fromAgent?.name || 'Não atribuído'} → ${toAgent?.name || 'Não atribuído'}`);
    }
    const body = `🔄 TRANSFERÊNCIA por ${author}\n${parts.join('\n')}${reason ? `\nMotivo: ${reason}` : ''}`;

    try {
      // atualiza o ticket
      await supa.update('tickets', `id=eq.${ticket.id}`, { queue: newQueueId, agent: newAgentId || null, updated_at: new Date().toISOString() });
      // registra o comentário de transferência
      await supa.insert('comments', { ticket_id: ticket.id, author, body, attachments: [] });
      const comment = { author, date: new Date().toISOString(), text: body, attachments: [], isTransfer: true };

      setTickets(ts => ts.map(t => t.id === ticket.id
        ? { ...t, queue: newQueueId, agent: newAgentId || null, comments: [...t.comments, comment], updated: new Date().toISOString() }
        : t));
      if (selectedTicket?.id === ticket.id) {
        setSelectedTicket(t => ({ ...t, queue: newQueueId, agent: newAgentId || null, comments: [...t.comments, comment] }));
      }
      show(`Chamado transferido${toQueue && newQueueId !== ticket.queue ? ` para ${toQueue.name}` : ''}${toAgent ? ` · ${toAgent.name}` : ''}!`);
    } catch(e) { show('Erro ao transferir: ' + e.message, 'error'); }
  };

  // Reabertura de chamado: volta para "Em Andamento" e registra como comentário
  const reopenTicket = async (ticket, reason) => {
    const author = currentUser?.name || 'Sistema';
    const fromStatus = STATUS_LABELS[ticket.status] || ticket.status;
    const body = `↩ REABERTURA por ${author}\nStatus anterior: ${fromStatus}\nMotivo: ${reason}`;
    try {
      await supa.update('tickets', `id=eq.${ticket.id}`, { status: 'pending', updated_at: new Date().toISOString() });
      await supa.insert('comments', { ticket_id: ticket.id, author, body, attachments: [] });
      const comment = { author, date: new Date().toISOString(), text: body, attachments: [], isReopen: true };
      setTickets(ts => ts.map(t => t.id === ticket.id
        ? { ...t, status: 'pending', comments: [...t.comments, comment], updated: new Date().toISOString() }
        : t));
      if (selectedTicket?.id === ticket.id) {
        setSelectedTicket(t => ({ ...t, status: 'pending', comments: [...t.comments, comment] }));
      }
      show('Chamado reaberto!');
    } catch(e) { show('Erro ao reabrir: ' + e.message, 'error'); }
  };

  // Cancelamento de chamado: registra motivo, data/hora e agente. Só admin reabre depois.
  const cancelTicket = async (ticket, reason) => {
    const author = currentUser?.name || 'Sistema';
    const body = `🚫 CANCELAMENTO por ${author}\nMotivo: ${reason}`;
    try {
      await supa.update('tickets', `id=eq.${ticket.id}`, { status: 'cancelled', updated_at: new Date().toISOString() });
      await supa.insert('comments', { ticket_id: ticket.id, author, body, attachments: [] });
      const comment = { author, date: new Date().toISOString(), text: body, attachments: [], isCancel: true };
      setTickets(ts => ts.map(t => t.id === ticket.id
        ? { ...t, status: 'cancelled', comments: [...t.comments, comment], updated: new Date().toISOString() }
        : t));
      if (selectedTicket?.id === ticket.id) {
        setSelectedTicket(t => ({ ...t, status: 'cancelled', comments: [...t.comments, comment] }));
      }
      show('Chamado cancelado.');
    } catch(e) { show('Erro ao cancelar: ' + e.message, 'error'); }
  };

  const approveTicket = async (id, _approverId, note) => {
    const tk = tickets.find(t => t.id === id);
    if (!tk) return;
    const chain = (tk.approvalChain || []).map(c => ({ ...c }));
    const idx = chain.findIndex(c => c.status === 'pending');
    if (idx === -1) { show('Não há aprovação pendente neste ticket.', 'error'); return; }

    // quem está aprovando agora (o aprovador do nível atual)
    const stepApprover = users.find(u => u.id === chain[idx].approverId);
    const decidedBy = currentUser?.name || stepApprover?.name || 'Aprovador';
    chain[idx].status = 'approved';
    chain[idx].note = note || '';
    chain[idx].decidedAt = new Date().toISOString();
    chain[idx].decidedBy = currentUser?.id || chain[idx].approverId;

    const nextIdx = chain.findIndex(c => c.status === 'pending');
    const isFinal = nextIdx === -1;

    const patch = isFinal
      ? { approvalChain: chain, approvalStatus: 'approved', status: 'open', currentApprover: null,
          approvedBy: chain[0].approverId, approvalNote: chain[0].note }
      : { approvalChain: chain, approvalStatus: 'pending', status: 'awaiting_approval',
          currentApprover: chain[nextIdx].approverId, approvalLevel: nextIdx + 1 };
    await updateTicket(id, patch);

    if (settings.ejsApprovalTpl) {
      const nextApprover = isFinal ? null : users.find(u => u.id === chain[nextIdx].approverId);
      sendEmail(settings, settings.ejsApprovalTpl, {
        to_email: tk.requester, to_name: tk.requester.split('@')[0],
        ticket_id: tk.id, ticket_title: tk.title,
        decision: isFinal ? 'APROVADO ✓ (final)' : `APROVADO no nível ${idx+1} ✓ — segue para ${nextApprover?.name||'próximo gestor'}`,
        approver_name: decidedBy, note: note || 'Sem observações.',
      });
    }
    show(isFinal
      ? `Aprovação final concluída por ${decidedBy}!`
      : `Nível ${idx+1} aprovado por ${decidedBy}! Segue para o próximo gestor.`);
  };

  const rejectTicket = async (id, _approverId, note) => {
    const tk = tickets.find(t => t.id === id);
    if (!tk) return;
    const chain = (tk.approvalChain || []).map(c => ({ ...c }));
    const idx = chain.findIndex(c => c.status === 'pending');
    const decidedBy = currentUser?.name || 'Aprovador';
    if (idx !== -1) {
      chain[idx].status = 'rejected';
      chain[idx].note = note || '';
      chain[idx].decidedAt = new Date().toISOString();
      chain[idx].decidedBy = currentUser?.id || chain[idx].approverId;
    }
    await updateTicket(id, {
      approvalChain: chain, approvalStatus: 'rejected', status: 'cancelled', currentApprover: null,
      approvedBy: chain[0]?.approverId, approvalNote: note,
    });
    if (settings.ejsApprovalTpl) {
      sendEmail(settings, settings.ejsApprovalTpl, {
        to_email: tk.requester, to_name: tk.requester.split('@')[0],
        ticket_id: tk.id, ticket_title: tk.title,
        decision: 'REJEITADO ✕', approver_name: decidedBy, note: note || 'Sem observações.',
      });
    }
    show('Ticket rejeitado.');
  };

  const saveSettings = async (newSettings) => {
    const dbRow = {
      company_name: newSettings.companyName, support_email: newSettings.supportEmail,
      app_name: newSettings.appName, logo_url: newSettings.logoUrl || null,
      auto_assign: newSettings.autoAssign, sla_alert: newSettings.slaAlert,
      email_notify: newSettings.emailNotify, closed_feedback: newSettings.closedFeedback,
      max_file_size: parseInt(newSettings.maxFileSize) || 10,
      ejs_public_key: newSettings.ejsPublicKey, ejs_service_id: newSettings.ejsServiceId,
      ejs_ticket_tpl: newSettings.ejsTicketTpl, ejs_status_tpl: newSettings.ejsStatusTpl,
      ejs_user_tpl: newSettings.ejsUserTpl, ejs_approval_tpl: newSettings.ejsApprovalTpl,
      ejs_enabled: newSettings.ejsEnabled,
    };
    try {
      await supa.update('settings', 'id=eq.1', dbRow);
      setSettings(newSettings);
      show('Configurações salvas!');
    } catch(e) { show('Erro ao salvar configurações: ' + e.message, 'error'); }
  };

  // Atualização do próprio perfil (nome exibido e senha)
  const updateProfile = async ({ name, currentPassword, newPassword }) => {
    if (!currentUser) return false;
    // valida senha atual se for trocar a senha
    if (newPassword) {
      if (currentPassword !== currentUser.password) {
        show('Senha atual incorreta.', 'error');
        return false;
      }
    }
    const dbPatch = {};
    if (name && name !== currentUser.name) dbPatch.name = name;
    if (newPassword) dbPatch.password = newPassword;
    if (Object.keys(dbPatch).length === 0) { show('Nada para atualizar.', 'error'); return false; }
    // atualiza avatar se o nome mudou
    if (dbPatch.name) {
      dbPatch.avatar = name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
    }
    try {
      await supa.update('users', `id=eq.${currentUser.id}`, dbPatch);
      const updated = { ...currentUser, ...dbPatch };
      setCurrentUser(updated);
      setUsers(us => us.map(u => u.id === currentUser.id ? { ...u, ...dbPatch } : u));
      show('Perfil atualizado com sucesso!');
      return true;
    } catch(e) { show('Erro ao atualizar perfil: ' + e.message, 'error'); return false; }
  };

  // queue CRUD
  const addQueue = async (data) => {
    const id = genId('q');
    const dbRow = { id, name: data.name, color: data.color, sla: data.sla, requires_approval: data.requiresApproval, approver: data.approver || null, area: data.area || null, description: data.description || null, template: data.template || null, requires_approval2: data.requiresApproval2 || false, approver2: data.approver2 || null, approval_levels: data.approvalLevels || 1, approval_flow: data.approvalFlow || null, checklist_items: data.checklistItems || null };
    try {
      await supa.insert('queues', dbRow);
      setQueues(qs => [...qs, mapQueue(dbRow)]);
      show('Fila criada!');
    } catch(e) { show('Erro: ' + e.message, 'error'); }
  };
  const removeQueue = async (id) => {
    try { await supa.delete('queues', `id=eq.${id}`); setQueues(qs => qs.filter(q => q.id !== id)); show('Fila removida!'); }
    catch(e) { show('Erro: ' + e.message, 'error'); }
  };
  const updateQueue = async (id, patch) => {
    const dbPatch = {};
    if (patch.requiresApproval !== undefined) dbPatch.requires_approval = patch.requiresApproval;
    if (patch.approver !== undefined) dbPatch.approver = patch.approver || null;
    if (patch.area !== undefined) dbPatch.area = patch.area || null;
    if (patch.sla !== undefined) dbPatch.sla = patch.sla;
    if (patch.description !== undefined) dbPatch.description = patch.description || null;
    if (patch.template !== undefined) dbPatch.template = patch.template || null;
    if (patch.requiresApproval2 !== undefined) dbPatch.requires_approval2 = patch.requiresApproval2;
    if (patch.approver2 !== undefined) dbPatch.approver2 = patch.approver2 || null;
    if (patch.approvalLevels !== undefined) dbPatch.approval_levels = patch.approvalLevels;
    if (patch.approvalFlow !== undefined) dbPatch.approval_flow = patch.approvalFlow;
    if (patch.checklistItems !== undefined) dbPatch.checklist_items = patch.checklistItems;
    try {
      await supa.update('queues', `id=eq.${id}`, dbPatch);
      setQueues(qs => qs.map(q => q.id === id ? { ...q, ...patch } : q));
      show('Fila atualizada!');
    } catch(e) { show('Erro: ' + e.message, 'error'); }
  };

  // area CRUD
  const addArea = async (data) => {
    const id = genId('ar');
    const dbRow = { id, name: data.name, description: data.description || '', color: data.color || '#e6401b' };
    try {
      await supa.insert('areas', dbRow);
      setAreas(as => [...as, mapArea(dbRow)]);
      show('Área criada!');
    } catch(e) { show('Erro ao criar área (a tabela "areas" existe no banco?): ' + e.message, 'error'); }
  };
  const removeArea = async (id) => {
    try {
      await supa.delete('areas', `id=eq.${id}`);
      setAreas(as => as.filter(a => a.id !== id));
      setQueues(qs => qs.map(q => q.area === id ? { ...q, area: null } : q));
      show('Área removida!');
    } catch(e) { show('Erro: ' + e.message, 'error'); }
  };

  // procedure CRUD
  const addProcedure = async (data) => {
    const id = genId('proc');
    const dbRow = { id, title: data.title, description: data.description || '', area_id: data.areaId || null, file: data.file || null, created_by: currentUser?.name || '' };
    try {
      await supa.insert('procedures', dbRow);
      setProcedures(ps => [mapProcedure({ ...dbRow, created_at: new Date().toISOString() }), ...ps]);
      show('Procedimento adicionado!');
    } catch(e) { show('Erro ao adicionar procedimento (a tabela "procedures" existe?): ' + e.message, 'error'); }
  };
  const removeProcedure = async (id) => {
    try {
      await supa.delete('procedures', `id=eq.${id}`);
      setProcedures(ps => ps.filter(p => p.id !== id));
      show('Procedimento removido!');
    } catch(e) { show('Erro: ' + e.message, 'error'); }
  };

  // user CRUD
  const addUser = async (data) => {
    const exists = users.find(u => u.email.toLowerCase() === data.email.toLowerCase());
    if (exists) { show('Este e-mail já está cadastrado.', 'error'); return false; }
    const initials = data.name.split(' ').map(w => w[0]).slice(0,2).join('').toUpperCase();
    const color = AVATAR_COLORS[users.length % AVATAR_COLORS.length];
    const id = genId('u');
    const dbRow = { id, name: data.name, email: data.email, password: data.password, role: data.role, avatar: initials, color, active: true, agent_id: data.agentId || null, approver_id: data.approverId || null, queue_id: (data.queueIds && data.queueIds[0]) || data.queueId || null, queue_ids: data.queueIds || [], area_id: data.areaId || null, manager_id: data.managerId || null, queue_admin: data.queueAdmin || false };
    try {
      await supa.insert('users', dbRow);
      setUsers(us => [...us, mapUser(dbRow)]);
      if (settings.ejsUserTpl) {
        sendEmail(settings, settings.ejsUserTpl, {
          to_email: data.email, to_name: data.name,
          user_role: ROLE_LABELS[data.role], user_email: data.email,
          user_password: data.password, login_url: window.location.href,
        });
      }
      show('Usuário criado!');
      return true;
    } catch(e) { show('Erro: ' + e.message, 'error'); return false; }
  };
  const updateUser = async (id, data) => {
    const dbPatch = { name: data.name, email: data.email, role: data.role, agent_id: data.agentId || null, approver_id: data.approverId || null, queue_id: (data.queueIds && data.queueIds[0]) || data.queueId || null, queue_ids: data.queueIds || [], area_id: data.areaId || null, manager_id: data.managerId || null, queue_admin: data.queueAdmin || false };
    if (data.password) dbPatch.password = data.password;
    try {
      await supa.update('users', `id=eq.${id}`, dbPatch);
      setUsers(us => us.map(u => u.id === id ? { ...u, ...data } : u));
      show('Usuário atualizado!');
    } catch(e) { show('Erro: ' + e.message, 'error'); }
  };
  const toggleUser = async (id) => {
    if (id === currentUser?.id) { show('Você não pode desativar sua própria conta.', 'error'); return; }
    const u = users.find(u => u.id === id);
    if (!u) return;
    try {
      await supa.update('users', `id=eq.${id}`, { active: !u.active });
      setUsers(us => us.map(x => x.id === id ? { ...x, active: !x.active } : x));
      show('Status atualizado!');
    } catch(e) { show('Erro: ' + e.message, 'error'); }
  };
  const deleteUser = async (id) => {
    if (id === currentUser?.id) { show('Você não pode excluir sua própria conta.', 'error'); return; }
    try {
      await supa.delete('users', `id=eq.${id}`);
      setUsers(us => us.filter(u => u.id !== id));
      show('Usuário removido.');
    } catch(e) { show('Erro: ' + e.message, 'error'); }
  };

  // ─── CONTROLE DE ACESSO POR FILA ─────────────────────────────
  // Admins veem tudo. Agentes vinculados a uma fila só veem a fila deles.
  const isAdmin = currentUser?.role === 'admin';
  const isApprover = currentUser?.role === 'approver';
  const isRequester = currentUser?.role === 'requester';
  const isQueueAdmin = currentUser?.role === 'agent' && currentUser?.queueAdmin === true;
  // Escopo do agente: pode ser várias filas, uma área inteira, ou tudo
  const myQueueIds = (currentUser?.queueIds && currentUser.queueIds.length > 0)
    ? currentUser.queueIds
    : (currentUser?.queueId ? [currentUser.queueId] : []);
  const myAreaId = currentUser?.areaId || null;
  // IDs das filas que o agente pode ver
  const myScopeQueueIds = myQueueIds.length > 0
    ? myQueueIds
    : myAreaId
      ? queues.filter(q => q.area === myAreaId).map(q => q.id)
      : null; // null = todas

  // Filtra tickets conforme permissão
  const myEmail = currentUser?.email?.toLowerCase();
  // id de agente do usuário atual (para ver tickets atribuídos a ele, mesmo fora da sua fila)
  const myAgentId = currentUser?.agentId || currentUser?.id;
  const mineByAssignment = (t) => t.agent && (t.agent === myAgentId || t.agent === currentUser?.id);
  const mineByRequester = (t) => t.requester && myEmail && t.requester.toLowerCase() === myEmail;
  const visibleTickets = isAdmin
    ? tickets
    : isRequester
      ? tickets.filter(t => mineByRequester(t))
      : myScopeQueueIds
        ? tickets.filter(t => myScopeQueueIds.includes(t.queue) || mineByRequester(t) || mineByAssignment(t))
        : tickets; // sem escopo definido = vê todos (fallback)

  const stats = {
    open: visibleTickets.filter(t => t.status === 'open').length,
    pending: visibleTickets.filter(t => t.status === 'pending').length,
    resolved: visibleTickets.filter(t => t.status === 'resolved').length,
    critical: visibleTickets.filter(t => t.priority === 'critical').length,
    awaitingApproval: visibleTickets.filter(t => t.status === 'awaiting_approval').length,
    concluded: visibleTickets.filter(t => t.status === 'resolved' || t.status === 'closed').length,
  };

  const filteredTickets = visibleTickets.filter(t =>
    !search || t.title.toLowerCase().includes(search.toLowerCase()) || t.id.toLowerCase().includes(search.toLowerCase())
  );

  // Filas visíveis: admin vê todas, agente vê só as do seu escopo
  const visibleQueues = isAdmin ? queues : myScopeQueueIds ? queues.filter(q => myScopeQueueIds.includes(q.id)) : queues;

  // Navegação conforme perfil
  const allNavItems = [
    { id:'dashboard', label:'Dashboard',        icon:'◈', roles:['admin','agent','approver','requester'] },
    { id:'tickets',   label: isRequester ? 'Meus Tickets' : 'Todos os Tickets', icon:'☰', badge: stats.open, roles:['admin','agent','approver','requester'] },
    { id:'approvals', label:'Aprovações',        icon:'✦', badge: stats.awaitingApproval, badgeClass: stats.awaitingApproval > 0 ? 'warn' : '', roles:['admin','approver'] },
    { id:'procedures',label:'Procedimentos',     icon:'📚', roles:['admin','agent','approver','requester'] },
    { id:'reports',   label:'Relatórios',        icon:'📊', roles:['admin'] },
    { id:'queues',    label:'Filas',             icon:'⫴', roles:['admin','agent'] },
    { id:'users',     label:'Usuários',          icon:'👥', roles:['admin'] },
    { id:'settings',  label:'Configurações',     icon:'⚙', roles:['admin'] },
    { id:'profile',   label:'Meu Perfil',        icon:'👤', roles:['admin','agent','approver','requester'] },
  ];
  const navItems = allNavItems.filter(n => n.roles.includes(currentUser?.role || 'agent'));

  // ── render states ──
  if (appState === 'loading') return <><LoadingScreen message="Conectando ao banco de dados..." /><ToastContainer /></>;
  if (appState === 'error')   return <><ErrorScreen message={dbError} onRetry={loadAll} /><ToastContainer /></>;
  if (appState === 'login')   return <><LoginPage onLogin={handleLogin} logoUrl={settings.logoUrl} appName={settings.appName} users={users} /><ToastContainer /></>;

  const goTo = (p) => { setPage(p); setMobileMenuOpen(false); };

  return (
    <>
      {/* HEADER MOBILE */}
      <div className="mobile-header">
        <button className="hamburger" onClick={() => setMobileMenuOpen(true)}>☰</button>
        <span className="mh-logo">{settings.appName || 'M7 Service Desk'}</span>
      </div>

      {/* OVERLAY MOBILE */}
      <div className={`mobile-overlay ${mobileMenuOpen ? 'show' : ''}`} onClick={() => setMobileMenuOpen(false)} />

      <div className={`sidebar ${mobileMenuOpen ? 'open' : ''}`}>
        <div className="sidebar-logo">
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            {settings.logoUrl
              ? <img src={settings.logoUrl} alt="logo" style={{width:32,height:32,borderRadius:8,objectFit:'contain',flexShrink:0}} />
              : <div style={{width:32,height:32,borderRadius:8,background:'linear-gradient(135deg,#e6401b,#ff5a2c)',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'var(--font-head)',fontWeight:900,fontSize:13,color:'#fff',flexShrink:0}}>M7</div>
            }
            <div>
              <div style={{fontFamily:'var(--font-head)',fontSize:17,fontWeight:800,background:'linear-gradient(135deg,#e6401b,#ff5a2c)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>{settings.appName || 'M7 Service Desk'}</div>
              <div style={{fontSize:11,color:'var(--muted)',fontWeight:300}}>{settings.companyName}</div>
            </div>
          </div>
        </div>
        <nav className="sidebar-nav">
          {!isAdmin && !isRequester && (myQueueIds.length > 0 || myAreaId) && (
            <div style={{margin:'4px 10px 8px', padding:'8px 12px', background:'rgba(230,64,27,0.1)', border:'1px solid rgba(230,64,27,0.25)', borderRadius:8, fontSize:11.5, color:'var(--accent)', lineHeight:1.5}}>
              {myQueueIds.length > 0
                ? <>⫴ Você atende {myQueueIds.length === 1 ? 'a fila' : `${myQueueIds.length} filas`}: <strong>{myQueueIds.map(qid => queues.find(q=>q.id===qid)?.name).filter(Boolean).join(', ') || '—'}</strong></>
                : <>▣ Você atende a área: <strong>{areas.find(a=>a.id===myAreaId)?.name || '—'}</strong></>}
            </div>
          )}
          {isRequester && (
            <div style={{margin:'4px 10px 8px', padding:'8px 12px', background:'rgba(96,165,250,0.1)', border:'1px solid rgba(96,165,250,0.25)', borderRadius:8, fontSize:11.5, color:'#60a5fa', lineHeight:1.5}}>
              👤 Você vê apenas os tickets que abriu
            </div>
          )}
          {navItems.map(n => (
            <div key={n.id} className={`nav-item ${page===n.id||(page==='ticket-detail'&&n.id==='tickets')?'active':''}`} onClick={() => goTo(n.id)}>
              <span className="icon">{n.icon}</span>{n.label}
              {n.badge ? <span className={`badge ${n.badgeClass||''}`}>{n.badge}</span> : null}
            </div>
          ))}
        </nav>
        <div className="sidebar-footer">
          <UserMenu currentUser={currentUser} onLogout={handleLogout} onProfile={() => goTo('profile')} />
        </div>
      </div>

      <div className="main">
        <div className="topbar">
          <div className="topbar-title">
            {page==='dashboard'    && 'Dashboard'}
            {page==='tickets'      && 'Todos os Tickets'}
            {page==='ticket-detail'&& (selectedTicket ? `#${selectedTicket.id}` : '')}
            {page==='approvals'    && 'Aprovações Pendentes'}
            {page==='reports'      && 'Relatórios'}
            {page==='queues'       && 'Filas de Atendimento'}
            {page==='users'        && 'Usuários'}
            {page==='settings'     && 'Configurações'}
            {page==='profile'      && 'Meu Perfil'}
            {page==='procedures'   && 'Procedimentos'}
          </div>
          <div className="search-wrap">
            <span className="search-icon">🔍</span>
            <input className="search-bar" placeholder="Buscar tickets..." value={search} onChange={e => setSearch(e.target.value)} />
          </div>
          <button className="btn btn-primary" onClick={() => setShowNewTicket(true)}>+ Novo Ticket</button>
        </div>

        <div className="page">
          {page==='dashboard'     && <Dashboard stats={stats} tickets={visibleTickets} queues={visibleQueues} approvers={approvers} onOpenTicket={openTicket} />}
          {page==='tickets'       && <TicketsList tickets={filteredTickets} queues={queues} agents={agents} approvers={approvers} onOpen={openTicket} />}
          {page==='ticket-detail' && selectedTicket && <TicketDetail ticket={selectedTicket} queues={queues} agents={agents} approvers={approvers} users={users} currentUser={currentUser} isAdmin={isAdmin} onUpdate={updateTicket} onComment={addComment} onApprove={approveTicket} onReject={rejectTicket} onTransfer={transferTicket} onReopen={reopenTicket} onCancel={cancelTicket} onBack={() => setPage('tickets')} show={show} />}
          {page==='approvals'     && <ApprovalsView tickets={tickets} queues={queues} agents={agents} approvers={approvers} users={users} currentUser={currentUser} isAdmin={isAdmin} onOpenTicket={openTicket} onApprove={approveTicket} onReject={rejectTicket} />}
          {page==='reports'       && isAdmin && <ReportsView tickets={tickets} queues={queues} areas={areas} agents={agents} approvers={approvers} />}
          {page==='queues'        && <QueuesView tickets={visibleTickets} queues={visibleQueues} agents={agents} approvers={approvers} eligibleApprovers={eligibleApprovers} areas={areas} onOpenTicket={openTicket} canManage={isAdmin || isQueueAdmin} onUpdateQueue={updateQueue} onAddQueue={addQueue} myScopeQueueIds={myScopeQueueIds} isFullAdmin={isAdmin} currentUser={currentUser} />}
          {page==='users'         && isAdmin && <UsersView users={users} queues={queues} agents={agents} areas={areas} tickets={tickets} currentUser={currentUser} settings={settings} onAdd={addUser} onUpdate={updateUser} onToggle={toggleUser} onDelete={deleteUser} show={show} />}
          {page==='settings'      && isAdmin && <SettingsView settings={settings} onSave={saveSettings} queues={queues} onAddQueue={addQueue} onRemoveQueue={removeQueue} onUpdateQueue={updateQueue} approvers={approvers} eligibleApprovers={eligibleApprovers} areas={areas} onAddArea={addArea} onRemoveArea={removeArea} onGoToUsers={() => setPage('users')} show={show} />}
          {page==='profile'       && <ProfileView currentUser={currentUser} queues={queues} areas={areas} onUpdateProfile={updateProfile} />}
          {page==='procedures'    && <ProceduresView procedures={procedures} areas={areas} canManage={isAdmin || isQueueAdmin} onAdd={addProcedure} onRemove={removeProcedure} show={show} />}
        </div>
      </div>

      {showNewTicket && <NewTicketModal queues={queues} agents={agents} areas={areas} currentUser={currentUser} onClose={() => setShowNewTicket(false)} onSave={data => { addTicket(data); setShowNewTicket(false); }} />}
      <ToastContainer />
    </>
  );
}

// ─── DASHBOARD ───────────────────────────────────────────────────
function Dashboard({ stats, tickets, queues, approvers, onOpenTicket }) {
  const recent = [...tickets].sort((a,b) => new Date(b.updated||b.created) - new Date(a.updated||a.created)).slice(0,5);
  return (
    <>
      <div className="stats-row" style={{gridTemplateColumns:'repeat(5,1fr)'}}>
        {[
          { label:'Em Aberto',     value:stats.open,             color:'var(--accent)',  icon:'📋', ca:'#e6401b' },
          { label:'Em Andamento',  value:stats.pending,          color:'var(--warning)', icon:'⏳', ca:'#fbbf24' },
          { label:'Ag. Aprovação', value:stats.awaitingApproval, color:'#ff9d5c',        icon:'✦', ca:'#ff9d5c' },
          { label:'Concluídos',    value:stats.concluded,        color:'var(--success)', icon:'✓', ca:'#34d399' },
          { label:'Críticos',      value:stats.critical,         color:'var(--danger)',  icon:'🚨', ca:'#f87171' },
        ].map(s => (
          <div key={s.label} className="stat-card" style={{'--card-accent':s.ca}}>
            <div className="stat-label">{s.label}</div>
            <div className="stat-value" style={{color:s.color}}>{s.value}</div>
            <div className="stat-icon">{s.icon}</div>
          </div>
        ))}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 300px',gap:20}}>
        <div className="card">
          <div className="card-header"><div className="card-title">Atividade Recente</div></div>
          <table><thead><tr><th>ID</th><th>Título</th><th>Fila</th><th>Prioridade</th><th>Status</th><th>Atualizado</th></tr></thead>
          <tbody>
            {recent.length === 0 ? <tr><td colSpan={6}><div className="empty-state"><div className="empty-state-icon">📋</div><div className="empty-state-text">Nenhum ticket ainda</div></div></td></tr>
            : recent.map(t => { const q = queues.find(q=>q.id===t.queue); return (
              <tr key={t.id} onClick={() => onOpenTicket(t)}>
                <td style={{color:'var(--muted)',fontFamily:'monospace',fontSize:12}}>{t.id}</td>
                <td style={{maxWidth:200}}>{t.title}</td>
                <td><span className="chip">{q?.name||t.queue}</span></td>
                <td><PrioTag p={t.priority} /></td>
                <td><StatusTag s={t.status} /></td>
                <td style={{color:'var(--muted)',fontSize:12}}>{fmtDate(t.updated||t.created)}</td>
              </tr>
            );})}
          </tbody></table>
        </div>
        <div className="card">
          <div className="card-header"><div className="card-title">Tickets por Fila</div></div>
          <div style={{padding:16}}>
            {queues.map(q => {
              const count = tickets.filter(t=>t.queue===q.id).length;
              const pct = tickets.length ? Math.round((count/tickets.length)*100) : 0;
              const ap = approvers.find(a=>a.id===q.approver);
              return (
                <div key={q.id} style={{marginBottom:16}}>
                  <div style={{display:'flex',justifyContent:'space-between',marginBottom:4,fontSize:13}}>
                    <span style={{display:'flex',alignItems:'center',gap:6}}>
                      {q.name}
                      {q.requiresApproval && <span style={{fontSize:10,background:'rgba(255,157,92,0.18)',color:'#ff9d5c',padding:'1px 6px',borderRadius:99,fontWeight:600}}>aprovação</span>}
                    </span>
                    <span style={{color:'var(--muted)'}}>{count}</span>
                  </div>
                  {q.requiresApproval && ap && <div style={{fontSize:11,color:'var(--muted)',marginBottom:4}}>Aprovador: {ap.name}</div>}
                  <div style={{background:'var(--surface2)',borderRadius:99,height:6,overflow:'hidden'}}>
                    <div style={{width:`${pct}%`,height:'100%',background:q.color,borderRadius:99,transition:'width 0.4s'}} />
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </>
  );
}

// ─── TICKETS LIST ────────────────────────────────────────────────
function TicketsList({ tickets, queues, agents, approvers, onOpen }) {
  const [filterStatus, setFilterStatus] = useState('all');
  const [filterPrio,   setFilterPrio]   = useState('all');
  const [filterQueue,  setFilterQueue]  = useState('all');
  const [filterRequester, setFilterRequester] = useState('all');

  // Lista de solicitantes únicos (ordenada)
  const requesters = Array.from(new Set(tickets.map(t => t.requester).filter(Boolean)))
    .sort((a,b) => a.localeCompare(b,'pt-BR'));
  // Filas ordenadas alfabeticamente
  const sortedQueues = queues.slice().sort((a,b) => a.name.localeCompare(b.name,'pt-BR'));

  const filtered = tickets.filter(t =>
    (filterStatus==='all'||t.status===filterStatus) &&
    (filterPrio  ==='all'||t.priority===filterPrio) &&
    (filterQueue ==='all'||t.queue===filterQueue) &&
    (filterRequester==='all'||t.requester===filterRequester)
  );
  return (
    <>
      <div style={{display:'flex',gap:10,marginBottom:20,flexWrap:'wrap'}}>
        <select className="form-select" style={{width:'auto'}} value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}>
          <option value="all">Todos os status</option>
          {Object.entries(STATUS_LABELS).map(([k,v])=><option key={k} value={k}>{v}</option>)}
        </select>
        <select className="form-select" style={{width:'auto'}} value={filterPrio} onChange={e=>setFilterPrio(e.target.value)}>
          <option value="all">Todas as prioridades</option>
          {Object.entries(PRIO_LABELS).map(([k,v])=><option key={k} value={k}>{v}</option>)}
        </select>
        <select className="form-select" style={{width:'auto'}} value={filterQueue} onChange={e=>setFilterQueue(e.target.value)}>
          <option value="all">Todas as filas</option>
          {sortedQueues.map(q=><option key={q.id} value={q.id}>{q.name}</option>)}
        </select>
        <select className="form-select" style={{width:'auto',maxWidth:240}} value={filterRequester} onChange={e=>setFilterRequester(e.target.value)}>
          <option value="all">Todos os solicitantes</option>
          {requesters.map(r=><option key={r} value={r}>{r}</option>)}
        </select>
        <div style={{marginLeft:'auto',color:'var(--muted)',fontSize:13,alignSelf:'center'}}>{filtered.length} ticket(s)</div>
      </div>
      <div className="card">
        <table><thead><tr><th>ID</th><th>Título</th><th>Solicitante</th><th>Fila</th><th>Agente</th><th>Aprovação</th><th>Prioridade</th><th>Status</th><th>Criado</th></tr></thead>
        <tbody>
          {filtered.length===0 ? <tr><td colSpan={9}><div className="empty-state"><div className="empty-state-icon">🎉</div><div className="empty-state-text">Nenhum ticket encontrado</div></div></td></tr>
          : filtered.map(t => {
            const q  = queues.find(q=>q.id===t.queue);
            const a  = agents.find(a=>a.id===t.agent);
            const ap = approvers.find(a=>a.id===t.approvedBy);
            return (
              <tr key={t.id} onClick={()=>onOpen(t)}>
                <td style={{color:'var(--muted)',fontFamily:'monospace',fontSize:12}}>{t.id}</td>
                <td style={{maxWidth:200,fontWeight:500}}>{t.title}</td>
                <td style={{color:'var(--muted)',fontSize:12}}>{t.requester}</td>
                <td><div style={{display:'flex',alignItems:'center',gap:5}}><span className="chip" style={{borderLeft:`3px solid ${q?.color||'#e6401b'}`}}>{q?.name||'—'}</span>{q?.requiresApproval&&<span style={{fontSize:10,color:'#ff9d5c'}}>✦</span>}</div></td>
                <td style={{fontSize:12}}>{a?.name||<span style={{color:'var(--muted)'}}>Não atribuído</span>}</td>
                <td>
                  {t.approvalStatus==='pending'  && <span className="tag tag-awaiting_approval">Pendente</span>}
                  {t.approvalStatus==='approved' && <span className="tag tag-approved">✓ {ap?.name||'Aprovado'}</span>}
                  {t.approvalStatus==='rejected' && <span className="tag tag-rejected">✕ Rejeitado</span>}
                  {!t.approvalStatus             && <span style={{color:'var(--muted)',fontSize:12}}>—</span>}
                </td>
                <td><PrioTag p={t.priority} /></td>
                <td><StatusTag s={t.status} /></td>
                <td style={{color:'var(--muted)',fontSize:12}}>{fmtDateShort(t.created)}</td>
              </tr>
            );
          })}
