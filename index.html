        {tab==='sla' && (
          <div className="settings-section">
            <div className="settings-section-title">SLA por Prioridade</div>
            {[
              {prio:'critical',label:'Crítica',hours:2,color:'var(--danger)'},
              {prio:'high',    label:'Alta',   hours:4,color:'var(--warning)'},
              {prio:'medium',  label:'Média',  hours:8,color:'var(--info)'},
              {prio:'low',     label:'Baixa',  hours:24,color:'var(--success)'},
            ].map(({prio,label,hours,color})=>(
              <div key={prio} className="settings-row">
                <div style={{display:'flex',alignItems:'center',gap:8,flex:1}}>
                  <span className="prio" style={{background:color}} />
                  <div className="settings-row-info"><div className="settings-row-label">{label}</div><div className="settings-row-desc">Tempo máximo de resolução</div></div>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <input className="form-input" type="number" defaultValue={hours} style={{width:80}} />
                  <span style={{color:'var(--muted)',fontSize:13}}>horas</span>
                </div>
              </div>
            ))}
            <div className="settings-row"><div style={{flex:1}} /><button className="btn btn-primary" onClick={()=>show('SLA salvo!')}>Salvar SLA</button></div>
          </div>
        )}

      </div>
    </div>
  );
}

// ─── NEW TICKET MODAL ────────────────────────────────────────────
function NewTicketModal({ queues, agents, areas, currentUser, onClose, onSave }) {
  const isAdmin = currentUser?.role === 'admin';
  const hasAreas = areas && areas.length > 0;
  // Áreas que efetivamente têm filas disponíveis para este usuário
  const availableAreas = hasAreas ? areas.filter(ar => queues.some(q => q.area === ar.id)) : [];
  const hasUnassignedQueues = queues.some(q => !q.area);

  const [selectedArea, setSelectedArea] = useState('');
  const [form, setForm] = useState({title:'',desc:'',queue:'',priority:'medium',agent:'',requester:currentUser?.email||'',checklist:[]});
  const [otherRequester, setOtherRequester] = useState(false);
  const [files, setFiles] = useState([]);
  const [submitting, setSubmitting] = useState(false);
  const fileInputRef = useRef(null);
  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  // Agentes relevantes para a fila selecionada (mesma fila, ou mesma área da fila, ou sem escopo)
  const relevantAgents = (() => {
    const active = agents.filter(a => a.active);
    if (!form.queue) return [];
    const selQueue = queues.find(q => q.id === form.queue);
    const selQueueArea = selQueue?.area || null;
    return active.filter(a => {
      const aQueueIds = (a.queueIds && a.queueIds.length > 0) ? a.queueIds : (a.queue ? [a.queue] : []);
      if (aQueueIds.length === 0 && !a.area) return true;          // atende tudo
      if (aQueueIds.includes(form.queue)) return true;             // vinculado à fila
      if (a.area && selQueueArea && a.area === selQueueArea) return true; // vinculado à área
      return false;
    });
  })();

  const MAX_FILE_MB = 10;
  const handleFiles = (fileList) => {
    const incoming = Array.from(fileList);
    const valid = [];
    for (const f of incoming) {
      if (f.size > MAX_FILE_MB * 1024 * 1024) {
        alert(`O arquivo "${f.name}" excede ${MAX_FILE_MB}MB e foi ignorado.`);
        continue;
      }
      valid.push(f);
    }
    setFiles(prev => [...prev, ...valid].slice(0, 5)); // máx 5 anexos
  };
  const removeFile = (idx) => setFiles(prev => prev.filter((_, i) => i !== idx));
  const fileIcon = (type) => {
    if (!type) return '📎';
    if (type.startsWith('image/')) return '🖼️';
    if (type.includes('pdf')) return '📄';
    if (type.includes('sheet') || type.includes('excel') || type.includes('csv')) return '📊';
    if (type.includes('word') || type.includes('document')) return '📝';
    if (type.includes('zip') || type.includes('compressed')) return '🗜️';
    return '📎';
  };
  const fmtSize = (b) => b < 1024 ? `${b}B` : b < 1048576 ? `${(b/1024).toFixed(0)}KB` : `${(b/1048576).toFixed(1)}MB`;

  const handleSubmit = async () => {
    setSubmitting(true);
    await onSave({ ...form, files });
    // o modal será fechado pelo onSave; se falhar, reabilita
    setSubmitting(false);
  };

  // Filas filtradas pela área selecionada
  const filteredQueues = (!hasAreas
    ? queues
    : selectedArea === '__none__'
      ? queues.filter(q => !q.area)
      : selectedArea
        ? queues.filter(q => q.area === selectedArea)
        : []
  ).slice().sort((a,b) => a.name.localeCompare(b.name,'pt-BR'));

  const handleAreaChange = (areaId) => {
    setSelectedArea(areaId);
    setForm(f=>({...f, queue:'', agent:'', checklist:[]})); // limpa fila, agente e checklist ao trocar de área
  };

  const valid = form.title && form.requester && form.queue;

  return (
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-header"><div className="modal-title">Novo Ticket</div><button className="btn btn-ghost btn-sm" onClick={onClose}>✕</button></div>
        <div className="modal-body">
          <div className="form-group"><label className="form-label">Título *</label><input className="form-input" value={form.title} onChange={e=>set('title',e.target.value)} placeholder="Descreva brevemente o problema" /></div>
          <div className="form-group"><label className="form-label">Descrição</label><textarea className="form-textarea" value={form.desc} onChange={e=>set('desc',e.target.value)} placeholder="Detalhes adicionais..." /></div>

          {hasAreas && (
            <div className="form-row">
              <div className="form-group"><label className="form-label">Área *</label>
                <select className="form-select" value={selectedArea} onChange={e=>handleAreaChange(e.target.value)}>
                  <option value="">Selecione a área</option>
                  {availableAreas.map(ar=><option key={ar.id} value={ar.id}>{ar.name}</option>)}
                  {hasUnassignedQueues && <option value="__none__">Outras filas</option>}
                </select>
              </div>
              <div className="form-group"><label className="form-label">Fila *</label>
                <select className="form-select" value={form.queue} onChange={e=>setForm(f=>({...f,queue:e.target.value,agent:'',checklist:[]}))} disabled={!selectedArea} style={{opacity:selectedArea?1:0.5,cursor:selectedArea?'pointer':'not-allowed'}}>
                  <option value="">{selectedArea ? 'Selecione a fila' : 'Escolha a área primeiro'}</option>
                  {filteredQueues.map(q=><option key={q.id} value={q.id}>{q.name} · SLA {q.sla}h</option>)}
                </select>
              </div>
            </div>
          )}

          {!hasAreas && (
            <div className="form-group"><label className="form-label">Fila *</label>
              <select className="form-select" value={form.queue} onChange={e=>setForm(f=>({...f,queue:e.target.value,agent:'',checklist:[]}))}>
                <option value="">Selecione a fila</option>
                {filteredQueues.map(q=><option key={q.id} value={q.id}>{q.name} · SLA {q.sla}h</option>)}
              </select>
            </div>
          )}

          {(() => {
            const selectedQueue = queues.find(q => q.id === form.queue);
            if (!selectedQueue || !selectedQueue.description) return null;
            return (
              <div style={{display:'flex',gap:10,padding:'12px 14px',background:'rgba(230,64,27,0.07)',border:'1px solid rgba(230,64,27,0.25)',borderRadius:10,marginTop:-4}}>
                <span style={{fontSize:16,flexShrink:0,lineHeight:1.3}}>ℹ️</span>
                <div>
                  <div style={{fontSize:12,fontWeight:700,color:'var(--accent)',marginBottom:3}}>Sobre a fila "{selectedQueue.name}"</div>
                  <div style={{fontSize:12.5,color:'var(--text)',lineHeight:1.6}}>{selectedQueue.description}</div>
                  <div style={{fontSize:11,color:'var(--muted)',marginTop:5}}>SLA de atendimento: {selectedQueue.sla}h{selectedQueue.requiresApproval ? ' · Requer aprovação' : ''}</div>
                </div>
              </div>
            );
          })()}

          {(() => {
            const selectedQueue = queues.find(q => q.id === form.queue);
            const clItems = selectedQueue?.checklistItems;
            if (!Array.isArray(clItems) || clItems.length === 0) return null;
            const selectedMap = {};
            (form.checklist||[]).forEach(c => { selectedMap[c.name] = c.qty; });
            const toggleItem = (name) => {
              const cur = form.checklist || [];
              if (selectedMap[name] !== undefined) {
                setForm(f=>({...f, checklist: cur.filter(c=>c.name!==name)}));
              } else {
                setForm(f=>({...f, checklist: [...cur, {name, qty:1}]}));
              }
            };
            const setQty = (name, qty) => {
              const n = Math.max(1, Number(qty)||1);
              setForm(f=>({...f, checklist: (f.checklist||[]).map(c=>c.name===name?{...c,qty:n}:c)}));
            };
            const totalItems = (form.checklist||[]).length;
            const totalQty = (form.checklist||[]).reduce((s,c)=>s+(c.qty||0),0);
            return (
              <div className="form-group">
                <label className="form-label">Itens solicitados</label>
                <div style={{border:'1px solid var(--border)',borderRadius:10,padding:'10px',display:'flex',flexDirection:'column',gap:6,maxHeight:260,overflowY:'auto'}}>
                  {clItems.map((item,i)=>{
                    const checked = selectedMap[item] !== undefined;
                    return (
                      <div key={i} style={{display:'flex',alignItems:'center',gap:10,padding:'7px 10px',borderRadius:8,background:checked?'rgba(230,64,27,0.08)':'var(--surface2)',border:`1px solid ${checked?'rgba(230,64,27,0.3)':'var(--border)'}`}}>
                        <label style={{display:'flex',alignItems:'center',gap:8,flex:1,cursor:'pointer',fontSize:13}}>
                          <input type="checkbox" checked={checked} onChange={()=>toggleItem(item)} style={{accentColor:'var(--accent)',width:16,height:16}} />
                          📦 {item}
                        </label>
                        {checked && (
                          <div style={{display:'flex',alignItems:'center',gap:6}}>
                            <span style={{fontSize:11,color:'var(--muted)'}}>Qtd:</span>
                            <button type="button" className="btn btn-ghost btn-sm" style={{padding:'2px 8px'}} onClick={()=>setQty(item,(selectedMap[item]||1)-1)}>−</button>
                            <input type="number" min="1" value={selectedMap[item]} onChange={e=>setQty(item,e.target.value)} style={{width:52,textAlign:'center',padding:'4px',borderRadius:6,border:'1px solid var(--border)',background:'var(--surface)',color:'var(--text)',fontSize:13}} />
                            <button type="button" className="btn btn-ghost btn-sm" style={{padding:'2px 8px'}} onClick={()=>setQty(item,(selectedMap[item]||1)+1)}>+</button>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
                {totalItems>0 && (
                  <div style={{fontSize:12,color:'var(--accent)',marginTop:6,fontWeight:600}}>
                    {totalItems} {totalItems===1?'item selecionado':'itens selecionados'} · {totalQty} {totalQty===1?'unidade':'unidades'} no total
                  </div>
                )}
              </div>
            );
          })()}

          <div className="form-row">
            <div className="form-group">
              <label className="form-label">Solicitante *</label>
              {!otherRequester ? (
                <div style={{display:'flex',alignItems:'center',gap:8,background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:8,padding:'8px 12px'}}>
                  <div className="avatar" style={{width:26,height:26,fontSize:11,background:`linear-gradient(135deg,${currentUser?.color||'#e6401b'},${(currentUser?.color||'#e6401b')}99)`,flexShrink:0}}>{currentUser?.avatar||'?'}</div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:12.5,fontWeight:600,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{currentUser?.name}</div>
                    <div style={{fontSize:11,color:'var(--muted)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{form.requester}</div>
                  </div>
                </div>
              ) : (
                <input className="form-input" value={form.requester} onChange={e=>set('requester',e.target.value)} placeholder="email@empresa.com" autoFocus />
              )}
              {isAdmin && (
                <button onClick={()=>{ setOtherRequester(v=>!v); if(otherRequester) set('requester',currentUser?.email||''); }} style={{background:'none',border:'none',color:'var(--accent)',fontSize:11.5,cursor:'pointer',padding:'4px 0 0',textAlign:'left',fontFamily:'var(--font-body)'}}>
                  {otherRequester ? '← Usar minha conta' : 'Abrir em nome de outro →'}
                </button>
              )}
            </div>
            <div className="form-group"><label className="form-label">Prioridade</label>
              <select className="form-select" value={form.priority} onChange={e=>set('priority',e.target.value)}>
                {Object.entries(PRIO_LABELS).map(([k,v])=><option key={k} value={k}>{v}</option>)}
              </select>
            </div>
          </div>

          {isAdmin && (
            <div className="form-group"><label className="form-label">Agente</label>
              <select className="form-select" value={form.agent} onChange={e=>set('agent',e.target.value)} disabled={!form.queue} style={{opacity:form.queue?1:0.5,cursor:form.queue?'pointer':'not-allowed'}}>
                <option value="">Não atribuído</option>
                {relevantAgents.map(a=><option key={a.id} value={a.id}>{a.name}</option>)}
              </select>
              <span style={{fontSize:11,color:'var(--muted)',marginTop:4}}>
                {!form.queue
                  ? 'Escolha a fila primeiro.'
                  : relevantAgents.length === 0
                    ? 'Nenhum agente vinculado a esta fila/área — deixe como "Não atribuído" ou transfira depois.'
                    : 'Agentes relacionados à fila/área selecionada.'}
              </span>
            </div>
          )}

          <div className="form-group">
            <label className="form-label">Anexos (opcional)</label>
            <div
              onClick={()=>fileInputRef.current?.click()}
              onDragOver={e=>{e.preventDefault();}}
              onDrop={e=>{e.preventDefault(); handleFiles(e.dataTransfer.files);}}
              style={{border:'1.5px dashed var(--border)',borderRadius:10,padding:'18px 16px',textAlign:'center',cursor:'pointer',background:'var(--surface2)',transition:'border-color 0.2s'}}
              onMouseEnter={e=>e.currentTarget.style.borderColor='var(--accent)'}
              onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border)'}
            >
              <div style={{fontSize:24,marginBottom:4}}>📎</div>
              <div style={{fontSize:13,fontWeight:600}}>Clique ou arraste arquivos aqui</div>
              <div style={{fontSize:11,color:'var(--muted)',marginTop:2}}>Até 5 arquivos · máx. {MAX_FILE_MB}MB cada</div>
            </div>
            <input ref={fileInputRef} type="file" multiple onChange={e=>{handleFiles(e.target.files); e.target.value='';}} style={{display:'none'}} />
            {files.length > 0 && (
              <div style={{display:'flex',flexDirection:'column',gap:6,marginTop:10}}>
                {files.map((f,i)=>(
                  <div key={i} style={{display:'flex',alignItems:'center',gap:10,background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:8,padding:'8px 12px'}}>
                    <span style={{fontSize:18,flexShrink:0}}>{fileIcon(f.type)}</span>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:12.5,fontWeight:500,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{f.name}</div>
                      <div style={{fontSize:11,color:'var(--muted)'}}>{fmtSize(f.size)}</div>
                    </div>
                    <button onClick={()=>removeFile(i)} style={{background:'none',border:'none',color:'var(--danger)',cursor:'pointer',fontSize:16,flexShrink:0,padding:'2px 6px'}}>✕</button>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={onClose} disabled={submitting}>Cancelar</button>
          <button className="btn btn-primary" disabled={!valid||submitting} style={{opacity:(valid&&!submitting)?1:0.5}} onClick={handleSubmit}>
            {submitting ? (files.length>0?'Enviando anexos...':'Criando...') : 'Criar Ticket'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── PROCEDURES VIEW (intranet) ──────────────────────────────────
function ProceduresView({ procedures, areas, canManage, onAdd, onRemove, show }) {
  const [showForm, setShowForm] = useState(false);
  const [filterArea, setFilterArea] = useState('all');
  const [form, setForm] = useState({ title:'', description:'', areaId:'' });
  const [file, setFile] = useState(null);
  const [uploading, setUploading] = useState(false);
  const fileRef = useRef(null);

  const fileIcon = (type) => !type ? '📄' : type.startsWith('image/') ? '🖼️' : type.includes('pdf') ? '📄' : type.includes('sheet')||type.includes('excel')||type.includes('csv') ? '📊' : type.includes('word')||type.includes('document') ? '📝' : type.includes('presentation')||type.includes('powerpoint') ? '📑' : type.includes('zip')||type.includes('compressed') ? '🗜️' : '📎';
  const fmtSize = (b) => !b ? '' : b < 1024 ? `${b}B` : b < 1048576 ? `${(b/1024).toFixed(0)}KB` : `${(b/1048576).toFixed(1)}MB`;

  const submit = async () => {
    if (!form.title.trim()) { show('Informe um título.', 'error'); return; }
    setUploading(true);
    let fileMeta = null;
    if (file) {
      try { fileMeta = await supa.uploadFile(file, 'procedures'); }
      catch(e) { show('Erro ao enviar arquivo: ' + e.message, 'error'); setUploading(false); return; }
    }
    await onAdd({ ...form, file: fileMeta });
    setUploading(false);
    setForm({ title:'', description:'', areaId:'' });
    setFile(null);
    setShowForm(false);
  };

  // agrupa por área
  const filtered = filterArea === 'all' ? procedures : procedures.filter(p => (filterArea==='none' ? !p.areaId : p.areaId === filterArea));
  const byArea = {};
  const noArea = [];
  filtered.forEach(p => { if (p.areaId) { (byArea[p.areaId]=byArea[p.areaId]||[]).push(p); } else { noArea.push(p); } });

  const renderCard = (p) => {
    const ic = fileIcon(p.file?.type);
    return (
      <div key={p.id} className="card" style={{padding:'16px 18px',display:'flex',gap:14,alignItems:'flex-start'}}>
        <span style={{fontSize:28,flexShrink:0}}>{ic}</span>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:700,fontSize:14.5,marginBottom:2}}>{p.title}</div>
          {p.description && <div style={{fontSize:12.5,color:'var(--muted)',lineHeight:1.5,marginBottom:6}}>{p.description}</div>}
          <div style={{fontSize:11,color:'var(--muted)'}}>{p.file ? `${p.file.name} · ${fmtSize(p.file.size)}` : 'Sem arquivo'}{p.createdBy?` · por ${p.createdBy}`:''}</div>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:6,flexShrink:0}}>
          {p.file && <a href={p.file.url} target="_blank" rel="noreferrer" className="btn btn-primary btn-sm" style={{textDecoration:'none',justifyContent:'center'}}>Baixar ↓</a>}
          {canManage && <button className="btn btn-sm" style={{background:'rgba(248,113,113,0.12)',color:'var(--danger)',border:'1px solid rgba(248,113,113,0.25)',justifyContent:'center'}} onClick={()=>{if(confirm('Remover este procedimento?'))onRemove(p.id);}}>Remover</button>}
        </div>
      </div>
    );
  };

  return (
    <div style={{display:'flex',flexDirection:'column',gap:20}}>
      <div style={{display:'flex',gap:12,alignItems:'center',flexWrap:'wrap'}}>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <span style={{fontSize:13,color:'var(--muted)'}}>Área:</span>
          <select className="form-select" style={{width:'auto',fontSize:13,padding:'6px 12px'}} value={filterArea} onChange={e=>setFilterArea(e.target.value)}>
            <option value="all">Todas</option>
            {areas.map(a=><option key={a.id} value={a.id}>{a.name}</option>)}
            <option value="none">Sem área</option>
          </select>
        </div>
        <div style={{marginLeft:'auto',color:'var(--muted)',fontSize:13}}>{filtered.length} procedimento(s)</div>
        {canManage && <button className="btn btn-primary" onClick={()=>setShowForm(v=>!v)}>+ Novo Procedimento</button>}
      </div>

      {canManage && showForm && (
        <div className="card" style={{padding:'20px 22px',display:'flex',flexDirection:'column',gap:14}}>
          <div style={{fontFamily:'var(--font-head)',fontSize:16,fontWeight:800}}>Novo Procedimento</div>
          <div className="form-row">
            <div className="form-group"><label className="form-label">Título *</label><input className="form-input" value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder="Ex: Como solicitar acesso a sistema" /></div>
            <div className="form-group"><label className="form-label">Área</label>
              <select className="form-select" value={form.areaId} onChange={e=>setForm({...form,areaId:e.target.value})}>

          <div className="form-group">
            <label className="form-label">Arquivo</label>
            {file ? (
              <div style={{display:'flex',alignItems:'center',gap:10,background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:8,padding:'8px 12px'}}>
                <span style={{fontSize:18}}>{fileIcon(file.type)}</span>
                <span style={{flex:1,fontSize:12.5,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{file.name}</span>
                <button onClick={()=>setFile(null)} style={{background:'none',border:'none',color:'var(--danger)',cursor:'pointer',fontSize:15}}>✕</button>

              <button className="btn btn-ghost btn-sm" onClick={()=>fileRef.current?.click()}>📎 Selecionar arquivo</button>

          </div>
          <div style={{display:'flex',gap:10}}>
            <button className="btn btn-primary" disabled={uploading||!form.title.trim()} onClick={submit}>{uploading?'Enviando...':'Publicar'}</button>
            <button className="btn btn-ghost" onClick={()=>{setShowForm(false);setForm({title:'',description:'',areaId:''});setFile(null);}}>Cancelar</button>
          </div>
        </div>

      {filtered.length===0 ? (
        <div className="empty-state"><div className="empty-state-icon">📚</div><div className="empty-state-text">Nenhum procedimento cadastrado</div><div className="empty-state-sub">{canManage?'Clique em "Novo Procedimento" para adicionar':'Ainda não há procedimentos publicados'}</div></div>
      ) : (
        <div style={{display:'flex',flexDirection:'column',gap:24}}>
          {areas.map(area => {
            const list = byArea[area.id];
            if (!list || list.length===0) return null;
            return (
              <div key={area.id}>
                <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12,paddingBottom:8,borderBottom:`2px solid ${area.color}33`}}>
                  <div style={{width:6,height:22,borderRadius:3,background:area.color}} />
                  <div style={{fontFamily:'var(--font-head)',fontSize:17,fontWeight:800}}>{area.name}</div>
                  <span className="chip" style={{marginLeft:'auto'}}>{list.length}</span>
                </div>
                <div style={{display:'flex',flexDirection:'column',gap:10}}>{list.map(renderCard)}</div>
              </div>
            );
          })}
          {noArea.length>0 && (
            <div>
              <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12,paddingBottom:8,borderBottom:'2px solid var(--border)'}}>
                <div style={{width:6,height:22,borderRadius:3,background:'var(--muted)'}} />
                <div style={{fontFamily:'var(--font-head)',fontSize:17,fontWeight:800,color:'var(--muted)'}}>Geral</div>
                <span className="chip" style={{marginLeft:'auto'}}>{noArea.length}</span>
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:10}}>{noArea.map(renderCard)}</div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ─── PROFILE VIEW ────────────────────────────────────────────────
function ProfileView({ currentUser, queues, areas, onUpdateProfile }) {
  const [name, setName] = useState(currentUser?.name || '');
  const [currentPassword, setCurrentPassword] = useState('');
  const [newPassword, setNewPassword] = useState('');
  const [confirmPassword, setConfirmPassword] = useState('');
  const [showCur, setShowCur] = useState(false);
  const [showNew, setShowNew] = useState(false);
  const [saving, setSaving] = useState(false);

  const userQueue = currentUser?.queueId ? queues.find(q=>q.id===currentUser.queueId) : null;
  const userArea = currentUser?.areaId ? areas.find(a=>a.id===currentUser.areaId) : null;

  const nameChanged = name.trim() && name.trim() !== currentUser?.name;
  const wantsPasswordChange = newPassword || confirmPassword || currentPassword;
  const passwordValid = !wantsPasswordChange || (currentPassword && newPassword.length >= 4 && newPassword === confirmPassword);
  const canSave = (nameChanged || (wantsPasswordChange && passwordValid)) && !saving;

  const handleSave = async () => {
    if (wantsPasswordChange && newPassword !== confirmPassword) return;
    setSaving(true);
    const ok = await onUpdateProfile({
      name: name.trim(),
      currentPassword: wantsPasswordChange ? currentPassword : null,
      newPassword: wantsPasswordChange ? newPassword : null,
    });
    setSaving(false);
    if (ok) { setCurrentPassword(''); setNewPassword(''); setConfirmPassword(''); }
  };

  return (
    <div style={{maxWidth:640,margin:'0 auto'}}>
      {/* Cartão de identidade */}
      <div className="card" style={{marginBottom:20}}>
        <div style={{padding:'28px 24px',display:'flex',alignItems:'center',gap:18}}>
          <div className="avatar" style={{width:72,height:72,fontSize:26,background:`linear-gradient(135deg,${currentUser?.color||'#e6401b'},${(currentUser?.color||'#e6401b')}99)`,flexShrink:0}}>{currentUser?.avatar}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontFamily:'var(--font-head)',fontSize:22,fontWeight:800}}>{currentUser?.name}</div>
            <div style={{fontSize:13.5,color:'var(--muted)',marginBottom:8}}>{currentUser?.email}</div>
            <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
              <span className="tag" style={{background:`${ROLE_COLORS[currentUser?.role]}20`,color:ROLE_COLORS[currentUser?.role]}}>{ROLE_LABELS[currentUser?.role]}</span>
              {userQueue && <span className="chip" style={{borderLeft:`3px solid ${userQueue.color}`}}>⫴ {userQueue.name}</span>}
              {userArea && <span className="chip" style={{borderLeft:`3px solid ${userArea.color}`}}>▣ {userArea.name}</span>}
            </div>
          </div>
        </div>
      </div>

      {/* Editar nome */}
      <div className="card" style={{marginBottom:20}}>
        <div className="card-header"><div className="card-title">Dados Pessoais</div></div>
        <div style={{padding:'20px 24px'}}>
          <div className="form-group">
            <label className="form-label">Nome exibido</label>
            <input className="form-input" value={name} onChange={e=>setName(e.target.value)} placeholder="Seu nome" />
            <span style={{fontSize:11,color:'var(--muted)',marginTop:4}}>É assim que seu nome aparece nos tickets e comentários.</span>
          </div>
          <div className="form-group">
            <label className="form-label">E-mail</label>
            <input className="form-input" value={currentUser?.email||''} disabled style={{opacity:0.6,cursor:'not-allowed'}} />
            <span style={{fontSize:11,color:'var(--muted)',marginTop:4}}>O e-mail não pode ser alterado. Contate um administrador se necessário.</span>
          </div>
        </div>
      </div>

      {/* Trocar senha */}
      <div className="card" style={{marginBottom:20}}>
        <div className="card-header"><div className="card-title">Alterar Senha</div></div>
        <div style={{padding:'20px 24px'}}>
          <div className="form-group">
            <label className="form-label">Senha atual</label>
            <div style={{position:'relative'}}>
              <input className="form-input" type={showCur?'text':'password'} value={currentPassword} onChange={e=>setCurrentPassword(e.target.value)} placeholder="Digite sua senha atual" style={{paddingRight:42}} />
              <button onClick={()=>setShowCur(v=>!v)} style={{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',cursor:'pointer',color:'var(--muted)',fontSize:15}}>{showCur?'🙈':'👁'}</button>
            </div>
          </div>
          <div className="form-row">
            <div className="form-group">
              <label className="form-label">Nova senha</label>
              <div style={{position:'relative'}}>
                <input className="form-input" type={showNew?'text':'password'} value={newPassword} onChange={e=>setNewPassword(e.target.value)} placeholder="Mínimo 4 caracteres" style={{paddingRight:42}} />
                <button onClick={()=>setShowNew(v=>!v)} style={{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',cursor:'pointer',color:'var(--muted)',fontSize:15}}>{showNew?'🙈':'👁'}</button>
              </div>
            </div>
            <div className="form-group">
              <label className="form-label">Confirmar nova senha</label>
              <input className="form-input" type="password" value={confirmPassword} onChange={e=>setConfirmPassword(e.target.value)} placeholder="Repita a nova senha" />
            </div>
          </div>
          {wantsPasswordChange && newPassword && confirmPassword && newPassword !== confirmPassword && (
            <div style={{fontSize:12,color:'var(--danger)',marginTop:-4}}>⚠ As senhas não coincidem.</div>
          )}
          {wantsPasswordChange && newPassword && newPassword.length < 4 && (
            <div style={{fontSize:12,color:'var(--danger)',marginTop:-4}}>⚠ A nova senha deve ter ao menos 4 caracteres.</div>
          )}
        </div>
      </div>

      <div style={{display:'flex',justifyContent:'flex-end',gap:10}}>
        <button className="btn btn-primary" disabled={!canSave} style={{opacity:canSave?1:0.5}} onClick={handleSave}>
          {saving ? 'Salvando...' : 'Salvar Alterações'}
        </button>
      </div>
    </div>
  );
}

// ─── REPORTS VIEW ────────────────────────────────────────────────
function ReportsView({ tickets, queues, areas, agents, approvers }) {
  const [period, setPeriod] = useState('all'); // all | 30 | 7
  const [statusFilter, setStatusFilter] = useState('all'); // all | open | pending | ...

  // Filtrar por período E status
  const now = new Date();
  const filtered = tickets.filter(t => {
    // status
    if (statusFilter !== 'all' && t.status !== statusFilter) return false;
    // período
    if (period === 'all') return true;
    const days = period === '30' ? 30 : 7;
    const created = new Date(t.created);
    return (now - created) / (1000*60*60*24) <= days;
  });

  // ── MÉTRICAS SINTÉTICAS ──
  const total = filtered.length;
  const open = filtered.filter(t => t.status === 'open').length;
  const pending = filtered.filter(t => t.status === 'pending').length;
  const resolved = filtered.filter(t => t.status === 'resolved').length;
  const closed = filtered.filter(t => t.status === 'closed').length;
  const concluded = resolved + closed;
  const awaiting = filtered.filter(t => t.status === 'awaiting_approval').length;
  const critical = filtered.filter(t => t.priority === 'critical').length;
  const resolutionRate = total > 0 ? Math.round((concluded / total) * 100) : 0;

  // Tempo médio de resolução (horas) - tickets concluídos
  const concludedTickets = filtered.filter(t => (t.status === 'resolved' || t.status === 'closed') && t.created && t.updated);
  const avgResolutionH = concludedTickets.length > 0
    ? Math.round(concludedTickets.reduce((sum, t) => sum + (new Date(t.updated) - new Date(t.created)) / (1000*60*60), 0) / concludedTickets.length)
    : 0;

  // Aprovações
  const totalApprovals = filtered.filter(t => t.approvalStatus).length;
  const approved = filtered.filter(t => t.approvalStatus === 'approved').length;
  const rejected = filtered.filter(t => t.approvalStatus === 'rejected').length;
  const approvalRate = (approved+rejected) > 0 ? Math.round((approved/(approved+rejected))*100) : 0;

  // ── DADOS PARA GRÁFICOS ──
  // Status (donut)
  const statusData = [
    { label:'Aberto',        value:open,     color:'#e6401b' },
    { label:'Em Andamento',  value:pending,  color:'#fbbf24' },
    { label:'Ag. Aprovação', value:awaiting, color:'#ff9d5c' },
    { label:'Resolvido',     value:resolved, color:'#34d399' },
    { label:'Fechado',       value:closed,   color:'#6b7280' },
  ].filter(d => d.value > 0);

  // Prioridade (barras)
  const prioData = [
    { label:'Crítica', value:filtered.filter(t=>t.priority==='critical').length, color:'#ff4466' },
    { label:'Alta',    value:filtered.filter(t=>t.priority==='high').length,     color:'#f87171' },
    { label:'Média',   value:filtered.filter(t=>t.priority==='medium').length,   color:'#fbbf24' },
    { label:'Baixa',   value:filtered.filter(t=>t.priority==='low').length,      color:'#34d399' },
  ];

  // Por fila (barras horizontais)
  const queueData = queues.map(q => ({
    label: q.name, color: q.color,
    value: filtered.filter(t => t.queue === q.id).length,
  })).filter(d => d.value > 0).sort((a,b) => b.value - a.value);

  // Por área
  const areaData = (areas||[]).map(ar => {
    const arQueues = queues.filter(q => q.area === ar.id).map(q => q.id);
    return { label: ar.name, color: ar.color, value: filtered.filter(t => arQueues.includes(t.queue)).length };
  }).filter(d => d.value > 0).sort((a,b) => b.value - a.value);

  // Por agente (ranking)
  const agentData = agents.map(a => ({
    label: a.name,
    value: filtered.filter(t => t.agent === a.id).length,
    resolved: filtered.filter(t => t.agent === a.id && (t.status==='resolved'||t.status==='closed')).length,
  })).filter(d => d.value > 0).sort((a,b) => b.value - a.value).slice(0, 8);

  // Tickets ao longo do tempo (últimos 14 dias)
  const timelineData = [];
  for (let i = 13; i >= 0; i--) {
    const day = new Date(now);
    day.setDate(day.getDate() - i);
    day.setHours(0,0,0,0);
    const nextDay = new Date(day); nextDay.setDate(nextDay.getDate()+1);
    const count = tickets.filter(t => {
      const c = new Date(t.created);
      return c >= day && c < nextDay;
    }).length;
    timelineData.push({ date: day, count });
  }

  return (
    <div style={{display:'flex',flexDirection:'column',gap:24}}>
      {/* Filtros de período e status */}
      <div style={{display:'flex',gap:20,alignItems:'center',flexWrap:'wrap'}}>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <span style={{fontSize:13,color:'var(--muted)'}}>Período:</span>
          {[['all','Tudo'],['30','30 dias'],['7','7 dias']].map(([k,label]) => (
            <button key={k} className={`btn btn-sm ${period===k?'btn-primary':'btn-ghost'}`} onClick={()=>setPeriod(k)}>{label}</button>
          ))}
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <span style={{fontSize:13,color:'var(--muted)'}}>Status:</span>
          <select className="form-select" style={{width:'auto',fontSize:13,padding:'6px 12px'}} value={statusFilter} onChange={e=>setStatusFilter(e.target.value)}>
            <option value="all">Todos</option>
            <option value="open">Aberto</option>
            <option value="pending">Em Andamento</option>
            <option value="awaiting_approval">Ag. Aprovação</option>
            <option value="resolved">Resolvido</option>
            <option value="closed">Fechado</option>
            <option value="cancelled">Cancelado</option>
          </select>
          {statusFilter !== 'all' && (
            <button className="btn btn-ghost btn-sm" onClick={()=>setStatusFilter('all')} style={{color:'var(--muted)'}}>✕ limpar</button>
          )}
        </div>
      </div>

      {/* ── KPIs SINTÉTICOS ── */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:14}} className="reports-kpis">
        <KpiCard label="Total de Tickets" value={total} sub="no período" color="#e6401b" icon="🎫" />
        <KpiCard label="Taxa de Conclusão" value={`${resolutionRate}%`} sub={`${concluded} concluídos`} color="#34d399" icon="✓" />
        <KpiCard label="Tempo Médio Resolução" value={avgResolutionH>0?`${avgResolutionH}h`:'—'} sub="por ticket" color="#fbbf24" icon="⏱" />
        <KpiCard label="Tickets Críticos" value={critical} sub="alta prioridade" color="#f87171" icon="🚨" />
      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:14}} className="reports-kpis">
        <KpiCard label="Em Aberto" value={open} sub="aguardando" color="#e6401b" icon="📋" />
        <KpiCard label="Em Andamento" value={pending} sub="em atendimento" color="#fbbf24" icon="⏳" />
        <KpiCard label="Aprovações" value={totalApprovals} sub={`${approvalRate}% aprovados`} color="#ff9d5c" icon="✦" />
        <KpiCard label="Rejeitados" value={rejected} sub="reprovados" color="#f87171" icon="✕" />
      </div>

      {/* ── GRÁFICOS LINHA 1: Status (donut) + Prioridade (barras) ── */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}} className="reports-charts">
        <div className="card">
          <div className="card-header"><div className="card-title">Distribuição por Status</div></div>
          <div style={{padding:24,display:'flex',alignItems:'center',gap:24,flexWrap:'wrap',justifyContent:'center'}}>
            <DonutChart data={statusData} total={total} />
            <div style={{display:'flex',flexDirection:'column',gap:10,minWidth:140}}>
              {statusData.map(d => (
                <div key={d.label} style={{display:'flex',alignItems:'center',gap:8,fontSize:13}}>
                  <span style={{width:12,height:12,borderRadius:3,background:d.color,flexShrink:0}} />
                  <span style={{flex:1}}>{d.label}</span>
                  <strong>{d.value}</strong>
                </div>
              ))}
            </div>
          </div>
        </div>

        <div className="card">
          <div className="card-header"><div className="card-title">Tickets por Prioridade</div></div>
          <div style={{padding:24}}>
            <BarChart data={prioData} />
          </div>
        </div>
      </div>

      {/* ── GRÁFICO: Timeline ── */}
      <div className="card">
        <div className="card-header"><div className="card-title">Tickets Criados — Últimos 14 dias</div></div>
        <div style={{padding:24}}>
          <LineChart data={timelineData} />
        </div>
      </div>

      {/* ── GRÁFICOS LINHA 2: Fila + Área ── */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}} className="reports-charts">
        <div className="card">
          <div className="card-header"><div className="card-title">Tickets por Fila</div></div>
          <div style={{padding:24}}>
            {queueData.length === 0 ? <EmptyChart /> : <HBarChart data={queueData} />}
          </div>
        </div>
        <div className="card">
          <div className="card-header"><div className="card-title">Tickets por Área</div></div>
          <div style={{padding:24}}>
            {areaData.length === 0 ? <EmptyChart msg="Nenhuma área com tickets" /> : <HBarChart data={areaData} />}
          </div>
        </div>
      </div>

      {/* ── RANKING DE AGENTES ── */}
      <div className="card">
        <div className="card-header"><div className="card-title">Desempenho por Agente</div></div>
        {agentData.length === 0
          ? <EmptyChart msg="Nenhum ticket atribuído a agentes" />
          : (
            <table><thead><tr><th>Agente</th><th>Total</th><th>Concluídos</th><th>Taxa</th><th>Progresso</th></tr></thead>
            <tbody>{agentData.map(a => {
              const rate = a.value > 0 ? Math.round((a.resolved/a.value)*100) : 0;
              return (
                <tr key={a.label}>
                  <td><div style={{display:'flex',alignItems:'center',gap:10}}><div className="avatar" style={{width:30,height:30,fontSize:11}}>{a.label[0]}</div><span style={{fontWeight:500}}>{a.label}</span></div></td>
                  <td><strong>{a.value}</strong></td>
                  <td style={{color:'var(--success)'}}>{a.resolved}</td>
                  <td>{rate}%</td>
                  <td style={{minWidth:140}}>
                    <div style={{background:'var(--surface2)',borderRadius:99,height:8,overflow:'hidden'}}>
                      <div style={{width:`${rate}%`,height:'100%',background:'linear-gradient(90deg,#e6401b,#34d399)',borderRadius:99,transition:'width 0.4s'}} />
                    </div>
                  </td>
                </tr>
              );
            })}</tbody></table>
          )
        }
      </div>
    </div>
  );
}

function EmptyChart({ msg }) {
  return <div style={{textAlign:'center',padding:'40px 20px',color:'var(--muted)',fontSize:13}}>{msg||'Sem dados no período'}</div>;
}

// Donut chart SVG
function DonutChart({ data, total }) {
  const size = 160, stroke = 28, radius = (size - stroke) / 2, cx = size/2, cy = size/2;
  const circ = 2 * Math.PI * radius;
  const sum = data.reduce((s,d) => s+d.value, 0) || 1;
  let offset = 0;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={cx} cy={cy} r={radius} fill="none" stroke="var(--surface2)" strokeWidth={stroke} />
      {data.map((d,i) => {
        const frac = d.value / sum;
        const dash = frac * circ;
        const el = (
          <circle key={i} cx={cx} cy={cy} r={radius} fill="none" stroke={d.color} strokeWidth={stroke}
            strokeDasharray={`${dash} ${circ-dash}`} strokeDashoffset={-offset}
            transform={`rotate(-90 ${cx} ${cy})`} style={{transition:'stroke-dasharray 0.5s'}} />
        );
        offset += dash;
        return el;
      })}
      <text x={cx} y={cy-4} textAnchor="middle" fill="#fff" fontSize="28" fontWeight="800" fontFamily="var(--font-head)">{total}</text>
      <text x={cx} y={cy+16} textAnchor="middle" fill="var(--muted)" fontSize="11">tickets</text>
    </svg>
  );
}

// Vertical bar chart
function BarChart({ data }) {
  const max = Math.max(...data.map(d=>d.value), 1);
  const w = 100 / data.length;
  return (
    <div style={{display:'flex',alignItems:'flex-end',gap:12,height:180,paddingTop:10}}>
      {data.map(d => (
        <div key={d.label} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:8,height:'100%'}}>
          <div style={{flex:1,display:'flex',alignItems:'flex-end',width:'100%',justifyContent:'center'}}>
            <div style={{position:'relative',width:'70%',maxWidth:48,height:`${(d.value/max)*100}%`,minHeight:d.value>0?4:0,background:d.color,borderRadius:'6px 6px 0 0',transition:'height 0.5s'}}>
              <span style={{position:'absolute',top:-22,left:'50%',transform:'translateX(-50%)',fontSize:13,fontWeight:700}}>{d.value}</span>
            </div>
          </div>
          <span style={{fontSize:11,color:'var(--muted)',textAlign:'center'}}>{d.label}</span>
        </div>
      ))}
    </div>
  );
}

// Horizontal bar chart
function HBarChart({ data }) {
  const max = Math.max(...data.map(d=>d.value), 1);
  return (
    <div style={{display:'flex',flexDirection:'column',gap:14}}>
      {data.map(d => (
        <div key={d.label}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:5,fontSize:13}}>
            <span style={{whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',maxWidth:'70%'}}>{d.label}</span>
            <strong>{d.value}</strong>
          </div>
          <div style={{background:'var(--surface2)',borderRadius:99,height:10,overflow:'hidden'}}>
            <div style={{width:`${(d.value/max)*100}%`,height:'100%',background:d.color,borderRadius:99,transition:'width 0.5s'}} />
          </div>
        </div>
      ))}
    </div>
  );
}

// Line chart SVG
function LineChart({ data }) {
  const w = 800, h = 200, pad = 30;
  const max = Math.max(...data.map(d=>d.count), 1);
  const stepX = (w - pad*2) / (data.length - 1 || 1);
  const points = data.map((d,i) => ({
    x: pad + i*stepX,
    y: h - pad - (d.count/max)*(h - pad*2),
    count: d.count, date: d.date,
  }));
  const path = points.map((p,i) => `${i===0?'M':'L'} ${p.x} ${p.y}`).join(' ');
  const areaPath = `${path} L ${points[points.length-1].x} ${h-pad} L ${points[0].x} ${h-pad} Z`;
  return (
    <svg width="100%" viewBox={`0 0 ${w} ${h}`} style={{display:'block'}}>
      <defs>
        <linearGradient id="lineGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="rgba(230,64,27,0.3)" />
          <stop offset="100%" stopColor="rgba(230,64,27,0)" />
        </linearGradient>
      </defs>
      {/* grid lines */}
      {[0,0.25,0.5,0.75,1].map(f => (
        <line key={f} x1={pad} y1={pad+f*(h-pad*2)} x2={w-pad} y2={pad+f*(h-pad*2)} stroke="var(--border)" strokeWidth="1" strokeDasharray="3 3" />
      ))}
      <path d={areaPath} fill="url(#lineGrad)" />
      <path d={path} fill="none" stroke="#e6401b" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
      {points.map((p,i) => (
        <g key={i}>
          <circle cx={p.x} cy={p.y} r="4" fill="#e6401b" stroke="#0a0a0a" strokeWidth="2" />
          {p.count > 0 && <text x={p.x} y={p.y-10} textAnchor="middle" fill="#fff" fontSize="11" fontWeight="600">{p.count}</text>}
          {i % 2 === 0 && <text x={p.x} y={h-10} textAnchor="middle" fill="var(--muted)" fontSize="10">{p.date.getDate()}/{p.date.getMonth()+1}</text>}
        </g>
      ))}
    </svg>
  );
}

// ─── SHARED COMPONENTS ───────────────────────────────────────────
function StatusTag({ s }) {
  const map = {open:'tag-open',pending:'tag-pending',awaiting_approval:'tag-awaiting_approval',resolved:'tag-resolved',closed:'tag-closed',cancelled:'tag-cancelled'};
  return <span className={`tag ${map[s]||''}`}>{STATUS_LABELS[s]||s}</span>;
}
function PrioTag({ p }) {
  const map = {low:'prio-low',medium:'prio-medium',high:'prio-high',critical:'prio-critical'};
  return <span style={{display:'inline-flex',alignItems:'center',gap:5,fontSize:12}}><span className={`prio ${map[p]}`} />{PRIO_LABELS[p]||p}</span>;
}

// ─── AUTO DATA-LABELS PARA TABELAS NO MOBILE ──────────────────────
// Observa o DOM e adiciona data-label em cada <td> baseado no <th> correspondente,
// permitindo que o CSS mobile transforme tabelas em cards legíveis.
function applyTableLabels() {
  document.querySelectorAll('table').forEach(table => {
    const headers = Array.from(table.querySelectorAll('thead th')).map(th => th.textContent.trim());
    if (!headers.length) return;
    table.querySelectorAll('tbody tr').forEach(tr => {
      const cells = tr.querySelectorAll('td');
      // pular linhas de "empty state" (colspan)
      if (cells.length === 1 && cells[0].hasAttribute('colspan')) {
        cells[0].classList.add('empty-cell');
        return;
      }
      cells.forEach((td, i) => {
        if (headers[i]) td.setAttribute('data-label', headers[i]);
      });
    });
  });
}
// Reaplica sempre que o DOM muda (troca de página, novos tickets, etc.)
const _labelObserver = new MutationObserver(() => {
  clearTimeout(window._labelTimer);
  window._labelTimer = setTimeout(applyTableLabels, 100);
});
setTimeout(() => {
  applyTableLabels();
  _labelObserver.observe(document.getElementById('root'), { childList: true, subtree: true });
}, 500);

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
