        </tbody></table>
      </div>
    </>
  );
}

// ─── TICKET DETAIL ───────────────────────────────────────────────
function TicketDetail({ ticket, queues, agents, approvers, users, currentUser, isAdmin, onUpdate, onComment, onApprove, onReject, onTransfer, onReopen, onCancel, onBack }) {
  const [comment, setComment] = useState('');
  const [commentFiles, setCommentFiles] = useState([]);
  const [sendingComment, setSendingComment] = useState(false);
  const commentFileRef = useRef(null);
  const [approvalNote, setApprovalNote] = useState('');
  const [showTransfer, setShowTransfer] = useState(false);
  const [transferQueue, setTransferQueue] = useState(ticket.queue);
  const [transferAgent, setTransferAgent] = useState(ticket.agent||'');
  const [transferReason, setTransferReason] = useState('');
  const [transferring, setTransferring] = useState(false);
  const [showReopen, setShowReopen] = useState(false);
  const [reopenReason, setReopenReason] = useState('');
  const [reopening, setReopening] = useState(false);
  const [showCancel, setShowCancel] = useState(false);
  const [cancelReason, setCancelReason] = useState('');
  const [cancelling, setCancelling] = useState(false);
  const isRequester = currentUser?.role === 'requester';
  const q = queues.find(q=>q.id===ticket.queue);
  const chain = ticket.approvalChain || [];
  const curIdx = chain.findIndex(c => c.status === 'pending');
  const curStep = curIdx >= 0 ? chain[curIdx] : null;
  // só pode aprovar se for o aprovador atual da cadeia (ou admin)
  const canApprove = ticket.approvalStatus==='pending' && (isAdmin || ticket.currentApprover === currentUser?.id);

  const submitTransfer = async () => {
    const sameQueue = transferQueue === ticket.queue;
    const sameAgent = (transferAgent||'') === (ticket.agent||'');
    if (sameQueue && sameAgent) { alert('Selecione uma fila ou agente diferente para transferir.'); return; }
    setTransferring(true);
    await onTransfer(ticket, { queue: transferQueue, agent: transferAgent||null, reason: transferReason });
    setTransferring(false);
    setShowTransfer(false);
    setTransferReason('');
  };

  const submitReopen = async () => {
    if (!reopenReason.trim()) return;
    setReopening(true);
    await onReopen(ticket, reopenReason);
    setReopening(false);
    setShowReopen(false);
    setReopenReason('');
  };

  const submitCancel = async () => {
    if (!cancelReason.trim()) return;
    setCancelling(true);
    await onCancel(ticket, cancelReason);
    setCancelling(false);
    setShowCancel(false);
    setCancelReason('');
  };

  const addCommentFiles = (fileList) => {
    const incoming = Array.from(fileList).filter(f => {
      if (f.size > 10*1024*1024) { alert(`"${f.name}" excede 10MB e foi ignorado.`); return false; }
      return true;
    });
    setCommentFiles(prev => [...prev, ...incoming].slice(0, 5));
  };
  const cmtFileIcon = (type) => !type ? '📎' : type.startsWith('image/') ? '🖼️' : type.includes('pdf') ? '📄' : type.includes('sheet')||type.includes('excel')||type.includes('csv') ? '📊' : type.includes('word')||type.includes('document') ? '📝' : '📎';

  const submitComment = async () => {
    if (!comment.trim() && commentFiles.length === 0) return;
    setSendingComment(true);
    const ok = await onComment(ticket.id, comment, commentFiles);
    setSendingComment(false);
    if (ok !== false) { setComment(''); setCommentFiles([]); }
  };

  return (
    <>
      <button className="btn btn-ghost btn-sm" onClick={onBack} style={{marginBottom:20}}>← Voltar</button>
      {ticket.approvalStatus==='pending'  && <div className="approval-banner needs"    style={{marginBottom:20}}><div className="approval-icon">✦</div><div className="approval-text"><div className="approval-title">Aguardando Aprovação</div><div className="approval-sub">{curStep ? <>Nível {curStep.level} de {chain.length} — aguardando <strong>{curStep.approverName}</strong></> : 'Este ticket requer aprovação antes do atendimento.'}</div></div></div>}
      {ticket.approvalStatus==='approved' && <div className="approval-banner approved" style={{marginBottom:20}}><div className="approval-icon">✓</div><div className="approval-text"><div className="approval-title" style={{color:'var(--success)'}}>Aprovado</div><div className="approval-sub">{chain.length>0 ? chain.map(c=>c.approverName).join(' → ') + ' aprovaram.' : (ticket.approvalNote||'Sem observações.')}</div></div></div>}
      {ticket.approvalStatus==='rejected' && <div className="approval-banner rejected" style={{marginBottom:20}}><div className="approval-icon">✕</div><div className="approval-text"><div className="approval-title" style={{color:'var(--danger)'}}>Rejeitado por {(chain.find(c=>c.status==='rejected')?.approverName)||'aprovador'}</div><div className="approval-sub">{(chain.find(c=>c.status==='rejected')?.note)||ticket.approvalNote||'Sem observações.'}</div></div></div>}

      <div className="ticket-detail">
        <div className="ticket-main">
          <div className="info-block">
            <div style={{display:'flex',alignItems:'flex-start',gap:14,marginBottom:16}}>
              <div style={{flex:1}}>
                <div style={{fontSize:12,color:'var(--muted)',marginBottom:6,fontFamily:'monospace'}}>{ticket.id}</div>
                <h2 style={{fontFamily:'var(--font-head)',fontSize:20,fontWeight:700,lineHeight:1.3}}>{ticket.title}</h2>
              </div>
              <div style={{display:'flex',gap:8,flexShrink:0}}><PrioTag p={ticket.priority} /><StatusTag s={ticket.status} /></div>
            </div>
            <p style={{fontSize:14,lineHeight:1.7,color:'var(--muted)'}}>{ticket.desc}</p>
            {q && q.template && (
              <div style={{marginTop:16,display:'flex',alignItems:'center',gap:12,padding:'12px 14px',background:'rgba(230,64,27,0.07)',border:'1px solid rgba(230,64,27,0.25)',borderRadius:10}}>
                <span style={{fontSize:22,flexShrink:0}}>📄</span>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12.5,fontWeight:700,color:'var(--accent)'}}>Modelo para download</div>
                  <div style={{fontSize:12,color:'var(--muted)'}}>Baixe, preencha/assine e anexe de volta num comentário.</div>
                </div>
                <a href={q.template.url} target="_blank" rel="noreferrer" className="btn btn-primary btn-sm" style={{flexShrink:0,textDecoration:'none'}}>Baixar ↓</a>
              </div>
            )}
          </div>
          {ticket.approvalStatus==='pending' && chain.length > 0 && (
            <div className="info-block" style={{border:'1px solid rgba(255,157,92,0.3)',background:'rgba(255,157,92,0.05)'}}>
              <div className="info-block-title" style={{color:'#ff9d5c'}}>✦ Cadeia de Aprovação</div>
              <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',marginBottom:canApprove?16:0}}>
                {chain.map((step,si)=>(
                  <div key={si} style={{display:'flex',alignItems:'center',gap:8}}>
                    {si>0 && <span style={{color:'var(--muted)'}}>→</span>}
                    <div style={{display:'flex',alignItems:'center',gap:6,padding:'5px 12px',borderRadius:99,fontSize:12,
                      background: step.status==='approved'?'rgba(52,211,153,0.15)':step.status==='rejected'?'rgba(248,113,113,0.15)':si===curIdx?'rgba(255,157,92,0.18)':'var(--surface3)',
                      color: step.status==='approved'?'var(--success)':step.status==='rejected'?'var(--danger)':si===curIdx?'#ff9d5c':'var(--muted)',
                      border: si===curIdx?'1px solid #ff9d5c':'1px solid transparent',fontWeight:600}}>
                      <span>{step.status==='approved'?'✓':step.status==='rejected'?'✕':si===curIdx?'⏳':'○'}</span>
                      <span>Nível {step.level}: {step.approverName}</span>
                    </div>
                  </div>
                ))}
              </div>
              {canApprove ? (
                <div style={{display:'flex',flexDirection:'column',gap:12}}>
                  <div style={{fontSize:12.5,color:'#ff9d5c',fontWeight:600}}>Sua decisão é necessária neste nível.</div>
                  <div className="form-group"><label className="form-label">Observação</label>
                    <textarea className="form-textarea" style={{minHeight:70}} value={approvalNote} onChange={e=>setApprovalNote(e.target.value)} placeholder="Justificativa..." />
                  </div>
                  <div style={{display:'flex',gap:10}}>
                    <button className="btn btn-primary" style={{background:'var(--success)'}} onClick={()=>onApprove(ticket.id,null,approvalNote)}>✓ Aprovar</button>
                    <button className="btn" style={{background:'var(--danger)',color:'#fff'}} onClick={()=>onReject(ticket.id,null,approvalNote)}>✕ Rejeitar</button>
                  </div>
                </div>
              ) : (
                <div style={{fontSize:12.5,color:'var(--muted)',marginTop:12}}>Aguardando decisão de <strong style={{color:'#ff9d5c'}}>{curStep?.approverName||'—'}</strong>.</div>
              )}
            </div>
          )}
          {ticket.checklist && ticket.checklist.length > 0 && (
            <div className="info-block">
              <div className="info-block-title">Itens solicitados ({ticket.checklist.length})</div>
              <div style={{display:'flex',flexDirection:'column',gap:6}}>
                {ticket.checklist.map((item,i)=>(
                  <div key={i} style={{display:'flex',alignItems:'center',gap:10,background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:8,padding:'8px 12px'}}>
                    <span style={{fontSize:16}}>📦</span>
                    <span style={{flex:1,fontSize:13}}>{item.name}</span>
                    <span style={{fontSize:13,fontWeight:700,color:'var(--accent)'}}>{item.qty} un.</span>
                  </div>
                ))}
                <div style={{fontSize:11.5,color:'var(--muted)',marginTop:2,textAlign:'right'}}>
                  Total: {ticket.checklist.reduce((s,c)=>s+(c.qty||0),0)} unidades
                </div>
              </div>
            </div>
          )}
          {ticket.attachments && ticket.attachments.length > 0 && (
            <div className="info-block">
              <div className="info-block-title">Anexos ({ticket.attachments.length})</div>
              <div style={{display:'flex',flexDirection:'column',gap:8}}>
                {ticket.attachments.map((a,i)=>{
                  const icon = !a.type ? '📎' : a.type.startsWith('image/') ? '🖼️' : a.type.includes('pdf') ? '📄' : a.type.includes('sheet')||a.type.includes('excel')||a.type.includes('csv') ? '📊' : a.type.includes('word')||a.type.includes('document') ? '📝' : '📎';
                  const sz = a.size < 1024 ? `${a.size}B` : a.size < 1048576 ? `${(a.size/1024).toFixed(0)}KB` : `${(a.size/1048576).toFixed(1)}MB`;
                  return (
                    <a key={i} href={a.url} target="_blank" rel="noreferrer" style={{display:'flex',alignItems:'center',gap:10,background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:8,padding:'10px 12px',textDecoration:'none',color:'var(--text)',transition:'border-color 0.2s'}} onMouseEnter={e=>e.currentTarget.style.borderColor='var(--accent)'} onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border)'}>
                      <span style={{fontSize:20,flexShrink:0}}>{icon}</span>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:13,fontWeight:500,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{a.name}</div>
                        <div style={{fontSize:11,color:'var(--muted)'}}>{sz}</div>
                      </div>
                      <span style={{fontSize:13,color:'var(--accent)',flexShrink:0}}>baixar ↓</span>
                    </a>
                  );
                })}
              </div>
            </div>
          )}
          <div className="info-block">
            <div className="info-block-title">Histórico de Comentários</div>
            {ticket.comments.length===0
              ? <div style={{color:'var(--muted)',fontSize:13,textAlign:'center',padding:'20px 0'}}>Nenhum comentário ainda.</div>
              : ticket.comments.map((c,i)=>{
                const isTransfer = c.isTransfer || (c.text && c.text.startsWith('🔄 TRANSFER'));
                const isReopen = c.isReopen || (c.text && c.text.startsWith('↩ REABERTURA'));
                const isCancel = c.isCancel || (c.text && c.text.startsWith('🚫 CANCELAMENTO'));
                if (isCancel) {
                  return (
                    <div key={i} style={{marginBottom:10,padding:'10px 14px',background:'rgba(248,113,113,0.08)',border:'1px solid rgba(248,113,113,0.28)',borderRadius:10}}>
                      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
                        <span style={{fontSize:14}}>🚫</span>
                        <span style={{fontSize:12,fontWeight:700,color:'var(--danger)'}}>Chamado cancelado</span>
                        <span style={{fontSize:11,color:'var(--muted)',marginLeft:'auto'}}>{fmtDate(c.date)}</span>
                      </div>
                      <div style={{fontSize:12.5,color:'var(--text)',lineHeight:1.6,whiteSpace:'pre-line',paddingLeft:22}}>{c.text.replace(/^🚫 CANCELAMENTO[^\n]*\n?/,'')}</div>
                      <div style={{fontSize:11,color:'var(--muted)',paddingLeft:22,marginTop:3}}>por {c.author}</div>
                    </div>
                  );
                }
                if (isReopen) {
                  return (
                    <div key={i} style={{marginBottom:10,padding:'10px 14px',background:'rgba(96,165,250,0.08)',border:'1px solid rgba(96,165,250,0.25)',borderRadius:10}}>
                      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
                        <span style={{fontSize:14}}>↩</span>
                        <span style={{fontSize:12,fontWeight:700,color:'#60a5fa'}}>Chamado reaberto</span>
                        <span style={{fontSize:11,color:'var(--muted)',marginLeft:'auto'}}>{fmtDate(c.date)}</span>
                      </div>
                      <div style={{fontSize:12.5,color:'var(--text)',lineHeight:1.6,whiteSpace:'pre-line',paddingLeft:22}}>{c.text.replace(/^↩ REABERTURA[^\n]*\n?/,'')}</div>
                      <div style={{fontSize:11,color:'var(--muted)',paddingLeft:22,marginTop:3}}>por {c.author}</div>
                    </div>
                  );
                }
                if (isTransfer) {
                  return (
                    <div key={i} style={{marginBottom:10,padding:'10px 14px',background:'rgba(230,64,27,0.07)',border:'1px solid rgba(230,64,27,0.2)',borderRadius:10}}>
                      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
                        <span style={{fontSize:14}}>🔄</span>
                        <span style={{fontSize:12,fontWeight:700,color:'var(--accent)'}}>Transferência de chamado</span>
                        <span style={{fontSize:11,color:'var(--muted)',marginLeft:'auto'}}>{fmtDate(c.date)}</span>
                      </div>
                      <div style={{fontSize:12.5,color:'var(--text)',lineHeight:1.6,whiteSpace:'pre-line',paddingLeft:22}}>{c.text.replace(/^🔄 TRANSFER[ÊE]NCIA[^\n]*\n?/,'')}</div>
                      <div style={{fontSize:11,color:'var(--muted)',paddingLeft:22,marginTop:3}}>por {c.author}</div>
                    </div>
                  );
                }
                return (
                <div key={i} className="comment" style={{marginBottom:10}}>
                  <div className="comment-header">
                    <div className="avatar" style={{width:28,height:28,fontSize:11}}>{c.author[0]}</div>
                    <span className="comment-author">{c.author}</span>
                    <span className="comment-date">{fmtDate(c.date)}</span>
                  </div>
                  {c.text && <div className="comment-body">{c.text}</div>}
                  {c.attachments && c.attachments.length > 0 && (
                    <div style={{display:'flex',flexWrap:'wrap',gap:8,marginTop:8}}>
                      {c.attachments.map((a,j)=>{
                        const ic = !a.type ? '📎' : a.type.startsWith('image/') ? '🖼️' : a.type.includes('pdf') ? '📄' : a.type.includes('sheet')||a.type.includes('excel')||a.type.includes('csv') ? '📊' : a.type.includes('word')||a.type.includes('document') ? '📝' : '📎';
                        return (
                          <a key={j} href={a.url} target="_blank" rel="noreferrer" style={{display:'flex',alignItems:'center',gap:6,background:'var(--surface3)',border:'1px solid var(--border)',borderRadius:6,padding:'5px 10px',textDecoration:'none',color:'var(--text)',fontSize:12}}>
                            <span>{ic}</span>
                            <span style={{maxWidth:160,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{a.name}</span>
                            <span style={{color:'var(--accent)'}}>↓</span>
                          </a>
                        );
                      })}
                    </div>
                  )}
                </div>
                );
              })
            }
            <div style={{marginTop:16}}>
              <textarea className="form-textarea" placeholder="Adicionar comentário..." value={comment} onChange={e=>setComment(e.target.value)} style={{marginBottom:10}} />
              {commentFiles.length > 0 && (
                <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:10}}>
                  {commentFiles.map((f,i)=>(
                    <div key={i} style={{display:'flex',alignItems:'center',gap:6,background:'var(--surface3)',border:'1px solid var(--border)',borderRadius:6,padding:'4px 8px',fontSize:12}}>
                      <span>{cmtFileIcon(f.type)}</span>
                      <span style={{maxWidth:140,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{f.name}</span>
                      <button onClick={()=>setCommentFiles(prev=>prev.filter((_,j)=>j!==i))} style={{background:'none',border:'none',color:'var(--danger)',cursor:'pointer',fontSize:14,padding:0}}>✕</button>
                    </div>
                  ))}
                </div>
              )}
              <div style={{display:'flex',gap:8,alignItems:'center'}}>
                <button className="btn btn-primary btn-sm" disabled={sendingComment||(!comment.trim()&&commentFiles.length===0)} style={{opacity:(sendingComment||(!comment.trim()&&commentFiles.length===0))?0.5:1}} onClick={submitComment}>
                  {sendingComment ? 'Enviando...' : 'Comentar'}
                </button>
                <button className="btn btn-ghost btn-sm" onClick={()=>commentFileRef.current?.click()} disabled={sendingComment}>📎 Anexar</button>
                <input ref={commentFileRef} type="file" multiple onChange={e=>{addCommentFiles(e.target.files); e.target.value='';}} style={{display:'none'}} />
                {commentFiles.length > 0 && <span style={{fontSize:11,color:'var(--muted)'}}>{commentFiles.length} arquivo(s)</span>}
              </div>
            </div>
          </div>
        </div>
        <div className="ticket-sidebar-panel">
          <div className="info-block">
            <div className="info-block-title">Ações Rápidas</div>
            {ticket.status==='cancelled' ? (
              <div style={{display:'flex',flexDirection:'column',gap:10}}>
                <div style={{padding:'10px 12px',background:'rgba(248,113,113,0.1)',border:'1px solid rgba(248,113,113,0.3)',borderRadius:8,fontSize:12.5,color:'var(--muted)',textAlign:'center'}}>
                  Chamado <strong style={{color:'var(--danger)'}}>Cancelado</strong>.<br/>{isAdmin ? 'Como admin, você pode reabrir.' : 'Apenas um administrador pode reabrir.'}
                </div>
                {isAdmin && !showReopen && (
                  <button className="btn btn-primary btn-sm" style={{justifyContent:'center'}} onClick={()=>setShowReopen(true)}>↩ Reabrir chamado</button>
                )}
                {isAdmin && showReopen && (
                  <div style={{padding:'14px',background:'var(--surface2)',border:'1px solid rgba(230,64,27,0.25)',borderRadius:10,display:'flex',flexDirection:'column',gap:10}}>
                    <div style={{fontSize:12.5,fontWeight:700,color:'var(--accent)'}}>Reabrir chamado cancelado</div>
                    <div className="form-group" style={{marginBottom:0}}>
                      <label className="form-label" style={{fontSize:11}}>Motivo da reabertura</label>
                      <textarea className="form-textarea" style={{minHeight:60,fontSize:12.5}} value={reopenReason} onChange={e=>setReopenReason(e.target.value)} placeholder="Ex: cancelamento foi indevido / solicitação retomada" />
                    </div>
                    <div style={{display:'flex',gap:8}}>
                      <button className="btn btn-primary btn-sm" style={{flex:1,justifyContent:'center'}} disabled={reopening||!reopenReason.trim()} onClick={submitReopen}>{reopening?'Reabrindo...':'Confirmar'}</button>
                      <button className="btn btn-ghost btn-sm" style={{flex:1,justifyContent:'center'}} onClick={()=>{setShowReopen(false);setReopenReason('');}}>Cancelar</button>
                    </div>
                  </div>
                )}
              </div>
            ) : (ticket.status==='resolved' || ticket.status==='closed') ? (
              <div style={{display:'flex',flexDirection:'column',gap:10}}>
                <div style={{padding:'10px 12px',background:ticket.status==='resolved'?'rgba(52,211,153,0.1)':'rgba(107,113,148,0.12)',border:`1px solid ${ticket.status==='resolved'?'rgba(52,211,153,0.3)':'var(--border)'}`,borderRadius:8,fontSize:12.5,color:'var(--muted)',textAlign:'center'}}>
                  Chamado <strong style={{color:ticket.status==='resolved'?'var(--success)':'var(--muted)'}}>{STATUS_LABELS[ticket.status]}</strong>.<br/>Para mexer no status, reabra primeiro.
                </div>
                {!isRequester && !showReopen && (
                  <button className="btn btn-primary btn-sm" style={{justifyContent:'center'}} onClick={()=>setShowReopen(true)}>↩ Reabrir chamado</button>
                )}
                {!isRequester && showReopen && (
                  <div style={{padding:'14px',background:'var(--surface2)',border:'1px solid rgba(230,64,27,0.25)',borderRadius:10,display:'flex',flexDirection:'column',gap:10}}>
                    <div style={{fontSize:12.5,fontWeight:700,color:'var(--accent)'}}>Reabrir chamado</div>
                    <div className="form-group" style={{marginBottom:0}}>
                      <label className="form-label" style={{fontSize:11}}>Motivo da reabertura</label>
                      <textarea className="form-textarea" style={{minHeight:60,fontSize:12.5}} value={reopenReason} onChange={e=>setReopenReason(e.target.value)} placeholder="Ex: problema voltou a ocorrer / solução não resolveu" />
                    </div>
                    <div style={{display:'flex',gap:8}}>
                      <button className="btn btn-primary btn-sm" style={{flex:1,justifyContent:'center'}} disabled={reopening||!reopenReason.trim()} onClick={submitReopen}>{reopening?'Reabrindo...':'Confirmar'}</button>
                      <button className="btn btn-ghost btn-sm" style={{flex:1,justifyContent:'center'}} onClick={()=>{setShowReopen(false);setReopenReason('');}}>Cancelar</button>
                    </div>
                  </div>
                )}
              </div>
            ) : (
              <div style={{display:'flex',flexDirection:'column',gap:8}}>
                {['open','pending','resolved','closed'].map(s=>(
                  <button key={s} className={`btn ${ticket.status===s?'btn-primary':'btn-ghost'} btn-sm`} style={{justifyContent:'center'}} onClick={()=>onUpdate(ticket.id,{status:s})}>{STATUS_LABELS[s]}</button>
                ))}
                {!isRequester && (
                  <button className="btn btn-ghost btn-sm" style={{justifyContent:'center',marginTop:4,borderColor:'var(--accent)',color:'var(--accent)'}} onClick={()=>{setShowTransfer(v=>!v); setTransferQueue(ticket.queue); setTransferAgent(ticket.agent||'');}}>
                    🔄 Transferir chamado
                  </button>
                )}
                {!isRequester && (
                  <button className="btn btn-ghost btn-sm" style={{justifyContent:'center',borderColor:'var(--danger)',color:'var(--danger)'}} onClick={()=>setShowCancel(v=>!v)}>
                    🚫 Cancelar chamado
                  </button>
                )}
              </div>
            )}
            {!isRequester && showCancel && ticket.status!=='cancelled' && ticket.status!=='resolved' && ticket.status!=='closed' && (
              <div style={{marginTop:12,padding:'14px',background:'var(--surface2)',border:'1px solid rgba(248,113,113,0.3)',borderRadius:10,display:'flex',flexDirection:'column',gap:10}}>
                <div style={{fontSize:12.5,fontWeight:700,color:'var(--danger)'}}>Cancelar chamado</div>
                <div style={{fontSize:11,color:'var(--muted)',lineHeight:1.5}}>⚠ Após cancelar, apenas um administrador poderá reabrir.</div>
                <div className="form-group" style={{marginBottom:0}}>
                  <label className="form-label" style={{fontSize:11}}>Motivo do cancelamento *</label>
                  <textarea className="form-textarea" style={{minHeight:60,fontSize:12.5}} value={cancelReason} onChange={e=>setCancelReason(e.target.value)} placeholder="Ex: solicitação duplicada / não é mais necessário" />
                </div>
                <div style={{display:'flex',gap:8}}>
                  <button className="btn btn-sm" style={{flex:1,justifyContent:'center',background:'var(--danger)',color:'#fff'}} disabled={cancelling||!cancelReason.trim()} onClick={submitCancel}>{cancelling?'Cancelando...':'Confirmar cancelamento'}</button>
                  <button className="btn btn-ghost btn-sm" style={{flex:1,justifyContent:'center'}} onClick={()=>{setShowCancel(false);setCancelReason('');}}>Voltar</button>
                </div>
              </div>
            )}
            {!isRequester && showTransfer && (
              <div style={{marginTop:12,padding:'14px',background:'var(--surface2)',border:'1px solid rgba(230,64,27,0.25)',borderRadius:10,display:'flex',flexDirection:'column',gap:10}}>
                <div style={{fontSize:12.5,fontWeight:700,color:'var(--accent)'}}>Transferir para</div>
                <div className="form-group" style={{marginBottom:0}}>
                  <label className="form-label" style={{fontSize:11}}>Fila de destino</label>
                  <select className="form-select" style={{fontSize:12.5}} value={transferQueue} onChange={e=>setTransferQueue(e.target.value)}>
                    {queues.slice().sort((a,b)=>a.name.localeCompare(b.name,'pt-BR')).map(qq=>(
                      <option key={qq.id} value={qq.id}>{qq.name}</option>
                    ))}
                  </select>
                </div>
                <div className="form-group" style={{marginBottom:0}}>
                  <label className="form-label" style={{fontSize:11}}>Agente responsável</label>
                  <select className="form-select" style={{fontSize:12.5}} value={transferAgent} onChange={e=>setTransferAgent(e.target.value)}>
                    <option value="">Não atribuído</option>
                    {agents.filter(a=>a.active).map(a=><option key={a.id} value={a.id}>{a.name}</option>)}
                  </select>
                </div>
                <div className="form-group" style={{marginBottom:0}}>
                  <label className="form-label" style={{fontSize:11}}>Motivo (opcional)</label>
                  <textarea className="form-textarea" style={{minHeight:50,fontSize:12.5}} value={transferReason} onChange={e=>setTransferReason(e.target.value)} placeholder="Ex: assunto pertence ao financeiro" />
                </div>
                <div style={{display:'flex',gap:8}}>
                  <button className="btn btn-primary btn-sm" style={{flex:1,justifyContent:'center'}} disabled={transferring} onClick={submitTransfer}>{transferring?'Transferindo...':'Confirmar'}</button>
                  <button className="btn btn-ghost btn-sm" style={{flex:1,justifyContent:'center'}} onClick={()=>setShowTransfer(false)}>Cancelar</button>
                </div>
              </div>
            )}
          </div>
          <div className="info-block">
            <div className="info-block-title">Detalhes</div>
            <div className="info-row"><span className="info-row-label">Solicitante</span><span className="info-row-value" style={{fontSize:12}}>{ticket.requester}</span></div>
            <div className="info-row"><span className="info-row-label">Fila</span>
              <select className="form-select" style={{padding:'3px 8px',fontSize:12,width:'auto'}} value={ticket.queue} onChange={e=>onUpdate(ticket.id,{queue:e.target.value})}>
                {queues.map(q=><option key={q.id} value={q.id}>{q.name}</option>)}
              </select>
            </div>
            <div className="info-row"><span className="info-row-label">Agente</span>
              <select className="form-select" style={{padding:'3px 8px',fontSize:12,width:'auto'}} value={ticket.agent||''} onChange={e=>onUpdate(ticket.id,{agent:e.target.value||null})}>
                <option value="">Não atribuído</option>
                {agents.filter(a=>a.active).map(a=><option key={a.id} value={a.id}>{a.name}</option>)}
              </select>
            </div>
            <div className="info-row"><span className="info-row-label">Prioridade</span>
              <select className="form-select" style={{padding:'3px 8px',fontSize:12,width:'auto'}} value={ticket.priority} onChange={e=>onUpdate(ticket.id,{priority:e.target.value})}>
                {Object.entries(PRIO_LABELS).map(([k,v])=><option key={k} value={k}>{v}</option>)}
              </select>
            </div>
            {q?.requiresApproval && (
              <div className="info-row"><span className="info-row-label">Aprovação</span>
                <span className="info-row-value">
                  {ticket.approvalStatus==='pending'  && <span style={{color:'#ff9d5c',fontSize:12}}>Pendente</span>}
                  {ticket.approvalStatus==='approved' && <span style={{color:'var(--success)',fontSize:12}}>Aprovado</span>}
                  {ticket.approvalStatus==='rejected' && <span style={{color:'var(--danger)',fontSize:12}}>Rejeitado</span>}
                  {!ticket.approvalStatus             && <span style={{color:'var(--muted)',fontSize:12}}>N/A</span>}
                </span>
              </div>
            )}
            <div className="info-row"><span className="info-row-label">Criado</span><span className="info-row-value" style={{fontSize:12}}>{fmtDate(ticket.created)}</span></div>
            <div className="info-row"><span className="info-row-label">Atualizado</span><span className="info-row-value" style={{fontSize:12}}>{fmtDate(ticket.updated)}</span></div>
          </div>
        </div>
      </div>
    </>
  );
}

// ─── APPROVALS VIEW ──────────────────────────────────────────────
function ApprovalsView({ tickets, queues, agents, approvers, users, currentUser, isAdmin, onOpenTicket, onApprove, onReject }) {
  // Pendentes: admin vê todas; aprovador vê só onde ele é o aprovador atual da cadeia
  const allPending = tickets.filter(t => t.approvalStatus === 'pending');
  const pending = isAdmin ? allPending : allPending.filter(t => t.currentApprover === currentUser?.id);
  const done = tickets.filter(t => t.approvalStatus === 'approved' || t.approvalStatus === 'rejected');
  const [noteMap, setNoteMap] = useState({});
  const getNote = id => noteMap[id] || '';
  const setNote = (id, v) => setNoteMap(m => ({ ...m, [id]: v }));
  const userName = (uid) => users.find(u => u.id === uid)?.name || '—';

  return (
    <>
      <div style={{marginBottom:28}}>
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:18}}>
          <div style={{fontSize:14,fontWeight:600}}>Pendentes de Aprovação</div>
          <span className="badge warn">{pending.length}</span>
        </div>
        {pending.length===0
          ? <div className="empty-state"><div className="empty-state-icon">✦</div><div className="empty-state-text">Nenhuma aprovação pendente</div><div className="empty-state-sub">Nada aguardando sua decisão no momento</div></div>
          : pending.map(t => {
            const q = queues.find(q=>q.id===t.queue);
            const a = agents.find(a=>a.id===t.agent);
            const chain = t.approvalChain || [];
            const curIdx = chain.findIndex(c => c.status === 'pending');
            const curStep = curIdx >= 0 ? chain[curIdx] : null;
            const totalLevels = chain.length;
            return (
              <div key={t.id} className="card" style={{marginBottom:14,borderColor:'rgba(255,157,92,0.3)'}}>
                <div style={{padding:'18px 22px',display:'flex',alignItems:'flex-start',gap:16,flexWrap:'wrap'}}>
                  <div style={{flex:1,minWidth:280}}>
                    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:8,flexWrap:'wrap'}}>
                      <span style={{fontFamily:'monospace',fontSize:11,color:'var(--muted)'}}>{t.id}</span>
                      <PrioTag p={t.priority} />
                      <span className="chip" style={{borderLeft:`3px solid ${q?.color}`}}>{q?.name}</span>
                      {totalLevels > 1 && curStep && <span className="tag" style={{background:'rgba(167,139,250,0.18)',color:'#a78bfa',fontWeight:600}}>Nível {curStep.level} de {totalLevels}</span>}
                    </div>
                    <div style={{fontWeight:700,fontSize:15,marginBottom:6,cursor:'pointer'}} onClick={()=>onOpenTicket(t)}>{t.title}</div>
                    <div style={{fontSize:13,color:'var(--muted)',marginBottom:10}}>{t.desc}</div>
                    <div style={{fontSize:12,color:'var(--muted)'}}>Solicitante: <strong>{t.requester}</strong>{a&&<> · Agente: <strong>{a.name}</strong></>} · Criado em {fmtDate(t.created)}</div>
                    {/* Visualização da cadeia de aprovação */}
                    {totalLevels > 0 && (
                      <div style={{display:'flex',alignItems:'center',gap:8,marginTop:10,flexWrap:'wrap'}}>
                        {chain.map((step,si)=>(
                          <div key={si} style={{display:'flex',alignItems:'center',gap:8}}>
                            {si>0 && <span style={{color:'var(--muted)',fontSize:12}}>→</span>}
                            <div style={{display:'flex',alignItems:'center',gap:6,padding:'4px 10px',borderRadius:99,fontSize:11.5,
                              background: step.status==='approved'?'rgba(52,211,153,0.15)':step.status==='rejected'?'rgba(248,113,113,0.15)':step.status==='pending'&&si===curIdx?'rgba(255,157,92,0.18)':'var(--surface3)',
                              color: step.status==='approved'?'var(--success)':step.status==='rejected'?'var(--danger)':step.status==='pending'&&si===curIdx?'#ff9d5c':'var(--muted)',
                              border: step.status==='pending'&&si===curIdx?'1px solid #ff9d5c':'1px solid transparent',fontWeight:600}}>
                              <span>{step.status==='approved'?'✓':step.status==='rejected'?'✕':si===curIdx?'⏳':'○'}</span>
                              <span>{step.approverName}</span>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                  <div style={{display:'flex',flexDirection:'column',gap:10,minWidth:260,flex:'0 0 260px'}}>
                    {(isAdmin || t.currentApprover === currentUser?.id) ? (
                      <>
                        <div style={{fontSize:12,color:'#ff9d5c',fontWeight:600}}>
                          {curStep ? <>Aguardando: {curStep.approverName}{t.currentApprover===currentUser?.id && ' (você)'}</> : 'Aguardando aprovação'}
                        </div>
                        <div className="form-group"><label className="form-label">Observação</label>
                          <textarea className="form-textarea" style={{minHeight:60}} value={getNote(t.id)} onChange={e=>setNote(t.id,e.target.value)} placeholder="Justificativa..." />
                        </div>
                        <div style={{display:'flex',gap:8}}>
                          <button className="btn btn-sm" style={{background:'var(--success)',color:'#fff',flex:1,justifyContent:'center'}} onClick={()=>onApprove(t.id,null,getNote(t.id))}>✓ Aprovar</button>
                          <button className="btn btn-sm" style={{background:'var(--danger)',color:'#fff',flex:1,justifyContent:'center'}} onClick={()=>onReject(t.id,null,getNote(t.id))}>✕ Rejeitar</button>
                        </div>
                      </>
                    ) : (
                      <div style={{fontSize:12,color:'var(--muted)',padding:'12px',background:'var(--surface2)',borderRadius:8,textAlign:'center'}}>
                        Aguardando decisão de<br/><strong style={{color:'#ff9d5c'}}>{curStep?.approverName||'—'}</strong>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            );
          })
        }
      </div>
      {done.length>0 && (
        <div>
          <div style={{fontSize:14,fontWeight:600,marginBottom:14,color:'var(--muted)'}}>Histórico</div>
          <div className="card"><table><thead><tr><th>ID</th><th>Título</th><th>Fila</th><th>Decisão</th><th>Cadeia</th><th>Data</th></tr></thead>
          <tbody>{done.map(t=>{
            const q=queues.find(q=>q.id===t.queue);
            const chain = t.approvalChain || [];
            return <tr key={t.id} onClick={()=>onOpenTicket(t)} style={{cursor:'pointer'}}>
              <td style={{fontFamily:'monospace',fontSize:12,color:'var(--muted)'}}>{t.id}</td>
              <td style={{fontWeight:500}}>{t.title}</td>
              <td><span className="chip">{q?.name||'—'}</span></td>
              <td>{t.approvalStatus==='approved'?<span className="tag tag-approved">✓ Aprovado</span>:<span className="tag tag-rejected">✕ Rejeitado</span>}</td>
              <td style={{fontSize:11.5,color:'var(--muted)'}}>
                {chain.length>0
                  ? chain.map((s,i)=><span key={i}>{i>0?' → ':''}<span style={{color:s.status==='approved'?'var(--success)':s.status==='rejected'?'var(--danger)':'var(--muted)'}}>{s.approverName}{s.status==='approved'?' ✓':s.status==='rejected'?' ✕':''}</span></span>)
                  : '—'}
              </td>
              <td style={{fontSize:12,color:'var(--muted)'}}>{fmtDate(t.updated)}</td>
            </tr>;
          })}</tbody></table></div>
        </div>
      )}
    </>
  );
}

// ─── QUEUES VIEW ─────────────────────────────────────────────────
function QueuesView({ tickets, queues, agents, approvers, eligibleApprovers, areas, onOpenTicket, canManage, onUpdateQueue, onAddQueue, myScopeQueueIds, isFullAdmin, currentUser }) {
  const [showCancelled, setShowCancelled] = useState(false);
  const [managingQueue, setManagingQueue] = useState(null); // id da fila sendo gerenciada

  // Agrupar filas por área
  const grouped = {};
  const noArea = [];
  queues.forEach(q => {
    if (q.area) {
      if (!grouped[q.area]) grouped[q.area] = [];
      grouped[q.area].push(q);
    } else {
      noArea.push(q);
    }
  });

  const renderQueue = (q) => {
    const qTickets = tickets.filter(t => t.queue === q.id && t.status !== 'closed' && (showCancelled || t.status !== 'cancelled'));
    const ap = approvers.find(a => a.id === q.approver);
    return (
      <div key={q.id} className="queue-col">
        <div className="queue-col-header" style={{borderTop:`3px solid ${q.color}`,flexDirection:'column',alignItems:'flex-start',gap:4}}>
          <div style={{display:'flex',alignItems:'center',gap:6,width:'100%'}}>
            <span style={{width:10,height:10,borderRadius:'50%',background:q.color,display:'inline-block',flexShrink:0}} />
            <span style={{flex:1}}>{q.name}</span>
            <span className="badge" style={{background:q.color}}>{qTickets.length}</span>
            {canManage && (
              <button title="Gerenciar fila" onClick={(e)=>{e.stopPropagation(); setManagingQueue(managingQueue===q.id?null:q.id);}} style={{background:'none',border:'none',cursor:'pointer',fontSize:13,color:'var(--muted)',padding:'0 2px'}}>⚙</button>
            )}
          </div>
          {q.requiresApproval && <div style={{fontSize:11,color:'#ff9d5c',paddingLeft:16}}>✦ {q.approvalFlow&&q.approvalFlow.length?'Fluxo personalizado':`Aprovação (${q.approvalLevels||1} nível/is)`}</div>}
          <div style={{fontSize:11,color:'var(--muted)',paddingLeft:16}}>SLA {q.sla}h</div>
        </div>
        {canManage && managingQueue===q.id && (
          <div style={{padding:'12px',borderBottom:'1px solid var(--border)',background:'var(--surface2)',display:'flex',flexDirection:'column',gap:10}}>
            <div style={{fontSize:11.5,fontWeight:700,color:'var(--accent)'}}>Gerenciar fila</div>
            <label style={{display:'flex',alignItems:'center',gap:8,fontSize:12}}>
              SLA:
              <input className="form-input" type="number" style={{width:70,fontSize:12,padding:'4px 8px'}} value={q.sla} onChange={e=>onUpdateQueue(q.id,{sla:Number(e.target.value)})} />h
            </label>
            {areas && areas.length>0 && (
              <label style={{display:'flex',alignItems:'center',gap:8,fontSize:12}}>
                Área:
                <select className="form-select" style={{width:'auto',fontSize:12,padding:'4px 8px'}} value={q.area||''} onChange={e=>onUpdateQueue(q.id,{area:e.target.value})}>
                  <option value="">Sem área</option>
                  {areas.map(a=><option key={a.id} value={a.id}>{a.name}</option>)}
                </select>
              </label>
            )}
            <div style={{width:'100%'}}>
              <QueueDescriptionEditor queue={q} onSave={(desc)=>onUpdateQueue(q.id,{description:desc})} />
            </div>
            <div style={{width:'100%'}}>
              <QueueTemplateEditor queue={q} onSave={(tpl)=>onUpdateQueue(q.id,{template:tpl})} />
                      <QueueChecklistEditor queue={q} onSave={(items)=>onUpdateQueue(q.id,{checklistItems:items})} />
            </div>
            <label style={{display:'flex',alignItems:'center',gap:8,fontSize:12,cursor:'pointer'}}>
              <button className={`toggle ${q.requiresApproval?'on':''}`} onClick={()=>onUpdateQueue(q.id,{requiresApproval:!q.requiresApproval})} />
              Requer aprovação
            </label>
            {q.requiresApproval && (
              <ApprovalFlowEditor queue={q} eligibleApprovers={eligibleApprovers} onSave={(patch)=>onUpdateQueue(q.id,patch)} />
            )}
          </div>
        )}
        <div className="queue-col-body">
          {qTickets.length===0
            ? <div style={{color:'var(--muted)',fontSize:12,textAlign:'center',paddingTop:30}}>Sem tickets</div>
            : qTickets.map(t=>{
              const ag=agents.find(a=>a.id===t.agent);
              return (
                <div key={t.id} className="queue-card" onClick={()=>onOpenTicket(t)}>
                  <div className="queue-card-id">{t.id} · SLA {q.sla}h</div>
                  <div className="queue-card-title">{t.title}</div>
                  <div className="queue-card-meta"><PrioTag p={t.priority} /><StatusTag s={t.status} /></div>
                  {ag && <div style={{marginTop:6,fontSize:11,color:'var(--muted)'}}>👤 {ag.name}</div>}
                  {t.approvalStatus==='pending' && <div style={{marginTop:6,fontSize:11,color:'#ff9d5c',fontWeight:600}}>✦ Ag. aprovação</div>}
                </div>
              );
            })
          }
        </div>
      </div>
    );
  };

  // Botão de exibir/ocultar cancelados (reutilizado)
  const cancelledCount = tickets.filter(t => t.status === 'cancelled').length;
  const toggleBar = (
    <div style={{display:'flex',alignItems:'center',justifyContent:'flex-end',gap:10,marginBottom:4}}>
      {cancelledCount > 0 && <span style={{fontSize:12,color:'var(--muted)'}}>{cancelledCount} cancelado(s)</span>}
      <label style={{display:'flex',alignItems:'center',gap:8,fontSize:13,cursor:'pointer',color:'var(--muted)'}}>
        <button className={`toggle ${showCancelled?'on':''}`} onClick={()=>setShowCancelled(v=>!v)} />
        Exibir cancelados
      </label>
    </div>
  );

  // Se não há áreas definidas, mostra layout antigo (todas as filas juntas)
  if (!areas || areas.length === 0) {
    return (
      <div style={{display:'flex',flexDirection:'column',gap:16}}>
        {toggleBar}
        <div className="queue-grid">{queues.map(renderQueue)}</div>
      </div>
    );
  }

  return (
    <div style={{display:'flex',flexDirection:'column',gap:28}}>
      {toggleBar}
      {areas.map(area => {
        const areaQueues = grouped[area.id] || [];
        if (areaQueues.length === 0) return null;
        const totalTickets = areaQueues.reduce((sum, q) => sum + tickets.filter(t => t.queue === q.id && t.status !== 'closed' && (showCancelled || t.status !== 'cancelled')).length, 0);
        return (
          <div key={area.id}>
            <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:14,paddingBottom:10,borderBottom:`2px solid ${area.color}33`}}>
              <div style={{width:6,height:24,borderRadius:3,background:area.color}} />
              <div style={{flex:1}}>
                <div style={{fontFamily:'var(--font-head)',fontSize:18,fontWeight:800,color:'#fff'}}>{area.name}</div>
                {area.description && <div style={{fontSize:12,color:'var(--muted)'}}>{area.description}</div>}
              </div>
              <span className="chip" style={{borderLeft:`3px solid ${area.color}`}}>{areaQueues.length} fila(s) · {totalTickets} ticket(s)</span>
            </div>
            <div className="queue-grid">{areaQueues.map(renderQueue)}</div>
          </div>
        );
      })}
      {noArea.length > 0 && (
        <div>
          <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:14,paddingBottom:10,borderBottom:'2px solid var(--border)'}}>
            <div style={{width:6,height:24,borderRadius:3,background:'var(--muted)'}} />
            <div style={{fontFamily:'var(--font-head)',fontSize:18,fontWeight:800,color:'var(--muted)'}}>Sem área definida</div>
          </div>
          <div className="queue-grid">{noArea.map(renderQueue)}</div>
        </div>
      )}
    </div>
  );
}

// ─── USERS VIEW ──────────────────────────────────────────────────
function UsersView({ users, queues, agents, areas, tickets, currentUser, settings, onAdd, onUpdate, onToggle, onDelete, show }) {
  const [showModal, setShowModal] = useState(false);
  const [editUser,  setEditUser]  = useState(null);
  const [search,    setSearch]    = useState('');
  const [filterRole,setFilterRole]= useState('all');

  const filtered = users.filter(u =>
    (filterRole==='all'||u.role===filterRole) &&
    (!search||u.name.toLowerCase().includes(search.toLowerCase())||u.email.toLowerCase().includes(search.toLowerCase()))
  );

  const openNew  = () => { setEditUser(null); setShowModal(true); };
  const openEdit = (u) => { setEditUser(u);   setShowModal(true); };

  const handleSave = async (data) => {
    let ok;
    if (editUser) { await onUpdate(editUser.id, data); ok = true; }
    else { ok = await onAdd(data); }
    if (ok !== false) setShowModal(false);
  };

  const roleCount = (role) => users.filter(u=>u.role===role).length;

  return (
    <>
      <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:14,marginBottom:24}} className="reports-kpis">
        {[
          {label:'Total de Usuários',value:users.length,       color:'var(--accent)',  icon:'👥'},
          {label:'Administradores',  value:roleCount('admin'),   color:'var(--accent)',  icon:'🛡'},
          {label:'Agentes',          value:roleCount('agent'),   color:'var(--success)', icon:'🎧'},
          {label:'Aprovadores',      value:roleCount('approver'),color:'#ff9d5c',        icon:'✦'},
          {label:'Solicitantes',     value:roleCount('requester'),color:'#60a5fa',       icon:'👤'},
        ].map(s=>(
          <div key={s.label} className="stat-card" style={{'--card-accent':s.color}}>
            <div className="stat-label">{s.label}</div>
            <div className="stat-value" style={{color:s.color,fontSize:28}}>{s.value}</div>
            <div className="stat-icon">{s.icon}</div>
          </div>
        ))}
      </div>
      <div style={{display:'flex',gap:10,marginBottom:18,alignItems:'center',flexWrap:'wrap'}}>
        <input className="form-input" style={{width:220}} placeholder="🔍  Buscar por nome ou e-mail..." value={search} onChange={e=>setSearch(e.target.value)} />
        <select className="form-select" style={{width:'auto'}} value={filterRole} onChange={e=>setFilterRole(e.target.value)}>
          <option value="all">Todos os perfis</option>
          <option value="admin">Administrador</option>
          <option value="agent">Agente</option>
          <option value="approver">Aprovador</option>
          <option value="requester">Solicitante</option>
        </select>
        <div style={{marginLeft:'auto',color:'var(--muted)',fontSize:13}}>{filtered.length} usuário(s)</div>
        <button className="btn btn-primary" onClick={openNew}>+ Novo Usuário</button>
      </div>
      <div className="card"><table><thead><tr><th>Usuário</th><th>E-mail</th><th>Perfil</th><th>Fila / Escopo</th><th>Status</th><th>Ações</th></tr></thead>
      <tbody>
        {filtered.length===0
          ? <tr><td colSpan={6}><div className="empty-state"><div className="empty-state-icon">👤</div><div className="empty-state-text">Nenhum usuário encontrado</div></div></td></tr>
          : filtered.map(u=>{
            const userQueueIds = (u.queueIds && u.queueIds.length>0) ? u.queueIds : (u.queueId ? [u.queueId] : []);
            const userQueuesList = userQueueIds.map(qid => queues.find(q=>q.id===qid)).filter(Boolean);
            const userArea = u.areaId ? areas.find(a=>a.id===u.areaId) : null;
            const isSelf=u.id===currentUser?.id;
            return (
              <tr key={u.id} style={{opacity:u.active===false?0.55:1}}>
                <td><div style={{display:'flex',alignItems:'center',gap:10}}>
                  <div className="avatar" style={{width:34,height:34,fontSize:12,background:`linear-gradient(135deg,${u.color},${u.color}99)`,flexShrink:0}}>{u.avatar}</div>
                  <div>
                    <div style={{fontWeight:600,fontSize:13.5}}>{u.name}{isSelf&&<span style={{fontSize:10,background:'rgba(230,64,27,0.15)',color:'var(--accent)',padding:'1px 7px',borderRadius:99,marginLeft:6,fontWeight:600}}>você</span>}</div>
                    <div style={{fontSize:11,color:'var(--muted)'}}>{u.id}</div>
                  </div>
                </div></td>
                <td style={{fontSize:13,color:'var(--muted)'}}>{u.email}</td>
                <td><span className="tag" style={{background:`${ROLE_COLORS[u.role]}20`,color:ROLE_COLORS[u.role]}}>{ROLE_LABELS[u.role]}</span></td>
                <td style={{fontSize:12,color:'var(--muted)'}}>
                  {u.role==='admin'
                    ? <span style={{color:'var(--muted)'}}>Acesso total</span>
                    : u.role==='approver'
                      ? <span className="chip">✦ Aprovador</span>
                      : u.role==='requester'
                        ? <span className="chip" style={{borderLeft:'3px solid #60a5fa'}}>👤 Próprios tickets</span>
                        : userQueuesList.length>0
                          ? <div style={{display:'flex',flexWrap:'wrap',gap:4}}>{userQueuesList.map(uq=><span key={uq.id} className="chip" style={{borderLeft:`3px solid ${uq.color}`}}>⫴ {uq.name}</span>)}</div>
                          : userArea
                            ? <span className="chip" style={{borderLeft:`3px solid ${userArea.color}`}}>▣ {userArea.name} (área)</span>
                            : <span style={{color:'var(--muted)'}}>Todas as filas</span>}
                </td>
                <td><span className="tag" style={{background:u.active!==false?'rgba(52,211,153,0.15)':'rgba(107,113,148,0.15)',color:u.active!==false?'var(--success)':'var(--muted)'}}>{u.active!==false?'Ativo':'Inativo'}</span></td>
                <td><div style={{display:'flex',gap:6}}>
                  <button className="btn btn-ghost btn-sm" onClick={()=>openEdit(u)}>Editar</button>
                  <button className="btn btn-ghost btn-sm" onClick={()=>onToggle(u.id)} disabled={isSelf}>{u.active!==false?'Desativar':'Ativar'}</button>
                  <button className="btn btn-sm" style={{background:'rgba(248,113,113,0.12)',color:'var(--danger)',border:'1px solid rgba(248,113,113,0.25)'}} onClick={()=>onDelete(u.id)} disabled={isSelf}>✕</button>
                </div></td>
              </tr>
            );
          })
        }
      </tbody></table></div>
      {showModal && <UserModal user={editUser} users={users} queues={queues} areas={areas} onClose={()=>setShowModal(false)} onSave={handleSave} />}
    </>
  );
}

function UserModal({ user, users, queues, areas, onClose, onSave }) {
  const isEdit = !!user;
  const existingQueueIds = (user?.queueIds && user.queueIds.length>0) ? user.queueIds : (user?.queueId ? [user.queueId] : []);
  const initialScope = existingQueueIds.length>0 ? 'queues' : user?.areaId ? 'area' : 'all';
  const [form, setForm] = useState({ name:user?.name||'', email:user?.email||'', password:'', role:user?.role||'agent', queueIds:existingQueueIds, areaId:user?.areaId||'', scopeType:initialScope, managerId:user?.managerId||'', queueAdmin:user?.queueAdmin||false });
  const [showPass, setShowPass] = useState(false);
  const set = (k,v) => setForm(f=>({...f,[k]:v}));
  const toggleQueue = (qid) => setForm(f => ({ ...f, queueIds: f.queueIds.includes(qid) ? f.queueIds.filter(x=>x!==qid) : [...f.queueIds, qid] }));
  const valid = form.name.trim() && form.email.trim() && (isEdit || form.password.trim());
  return (
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-header"><div className="modal-title">{isEdit?'Editar Usuário':'Novo Usuário'}</div><button className="btn btn-ghost btn-sm" onClick={onClose}>✕</button></div>
        <div className="modal-body">
          <div className="form-row">
            <div className="form-group"><label className="form-label">Nome completo *</label><input className="form-input" value={form.name} onChange={e=>set('name',e.target.value)} placeholder="Ex: João Silva" /></div>
            <div className="form-group"><label className="form-label">Perfil *</label>
              <select className="form-select" value={form.role} onChange={e=>set('role',e.target.value)}>
                <option value="admin">Administrador</option>
                <option value="agent">Agente</option>
                <option value="approver">Aprovador</option>
                <option value="requester">Solicitante</option>
              </select>
            </div>
          </div>
          <div className="form-group"><label className="form-label">E-mail *</label><input className="form-input" type="email" value={form.email} onChange={e=>set('email',e.target.value)} placeholder="usuario@empresa.com" /></div>
          <div className="form-group">
            <label className="form-label">{isEdit?'Nova senha (deixe em branco para manter)':'Senha *'}</label>
            <div style={{position:'relative'}}>
              <input className="form-input" type={showPass?'text':'password'} value={form.password} onChange={e=>set('password',e.target.value)} placeholder={isEdit?'••••••••':'Mínimo 6 caracteres'} style={{paddingRight:42}} />
              <button onClick={()=>setShowPass(v=>!v)} style={{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',cursor:'pointer',color:'var(--muted)',fontSize:15}}>{showPass?'🙈':'👁'}</button>
            </div>
          </div>
          {form.role==='agent' && (
            <>
              <div className="form-group"><label className="form-label">Escopo de atendimento</label>
                <select className="form-select" value={form.scopeType} onChange={e=>{
                  const v = e.target.value;
                  setForm(f=>({...f, scopeType:v, queueIds: v==='queues'?f.queueIds:[], areaId: v==='area'?f.areaId:''}));
                }}>
                  <option value="all">Todas as filas e áreas (sem restrição)</option>
                  {areas && areas.length>0 && <option value="area">Uma área inteira</option>}
                  <option value="queues">Filas específicas (uma ou mais)</option>
                </select>
              </div>
              {form.scopeType==='area' && areas && areas.length>0 && (
                <div className="form-group"><label className="form-label">Área</label>
                  <select className="form-select" value={form.areaId} onChange={e=>set('areaId',e.target.value)}>
                    <option value="">Selecione a área</option>
                    {areas.map(a=>{
                      const qCount = queues.filter(q=>q.area===a.id).length;
                      return <option key={a.id} value={a.id}>{a.name} ({qCount} fila{qCount!==1?'s':''})</option>;
                    })}
                  </select>
                  <span style={{fontSize:11,color:'var(--muted)',marginTop:4}}>O agente verá os tickets de todas as filas desta área.</span>
                </div>
              )}
              {form.scopeType==='queues' && (
                <div className="form-group"><label className="form-label">Filas atendidas ({form.queueIds.length} selecionada{form.queueIds.length!==1?'s':''})</label>
                  <div style={{maxHeight:200,overflowY:'auto',border:'1px solid var(--border)',borderRadius:8,padding:'8px'}}>
                    {(() => {
                      // agrupa por área para facilitar
                      const byArea = {};
                      const noArea = [];
                      queues.forEach(q => { if(q.area){ (byArea[q.area]=byArea[q.area]||[]).push(q); } else { noArea.push(q); } });
                      const blocks = [];
                      (areas||[]).forEach(ar => {
                        if (byArea[ar.id]) {
                          blocks.push(
                            <div key={ar.id} style={{marginBottom:6}}>
                              <div style={{fontSize:10.5,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',padding:'4px 6px',letterSpacing:0.5}}>{ar.name}</div>
                              {byArea[ar.id].map(q=>(
                                <label key={q.id} style={{display:'flex',alignItems:'center',gap:8,padding:'6px 8px',borderRadius:6,cursor:'pointer',fontSize:13}} onMouseEnter={e=>e.currentTarget.style.background='var(--surface2)'} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                                  <input type="checkbox" checked={form.queueIds.includes(q.id)} onChange={()=>toggleQueue(q.id)} style={{accentColor:'var(--accent)',width:15,height:15}} />
                                  <span style={{width:9,height:9,borderRadius:'50%',background:q.color,flexShrink:0}} />
                                  {q.name}
                                </label>
                              ))}
                            </div>
                          );
                        }
                      });
                      if (noArea.length) {
                        blocks.push(
                          <div key="noarea" style={{marginBottom:6}}>
                            <div style={{fontSize:10.5,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',padding:'4px 6px',letterSpacing:0.5}}>Sem área</div>
                            {noArea.map(q=>(
                              <label key={q.id} style={{display:'flex',alignItems:'center',gap:8,padding:'6px 8px',borderRadius:6,cursor:'pointer',fontSize:13}} onMouseEnter={e=>e.currentTarget.style.background='var(--surface2)'} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                                <input type="checkbox" checked={form.queueIds.includes(q.id)} onChange={()=>toggleQueue(q.id)} style={{accentColor:'var(--accent)',width:15,height:15}} />
                                <span style={{width:9,height:9,borderRadius:'50%',background:q.color,flexShrink:0}} />
                                {q.name}
                              </label>
                            ))}
                          </div>
                        );
                      }
                      return blocks;
                    })()}
                  </div>
                  <span style={{fontSize:11,color:'var(--muted)',marginTop:4}}>Marque uma ou mais filas — podem ser de áreas diferentes. O agente verá os tickets de todas elas.</span>
                </div>
              )}
            </>
          )}
          <div className="form-group"><label className="form-label">Gestor (aprovador hierárquico)</label>
            <select className="form-select" value={form.managerId} onChange={e=>set('managerId',e.target.value)}>
              <option value="">Nenhum (sem gestor)</option>
              {(users||[]).filter(u=>u.id!==user?.id).slice().sort((a,b)=>a.name.localeCompare(b.name,'pt-BR')).map(u=>(
                <option key={u.id} value={u.id}>{u.name} — {ROLE_LABELS[u.role]}</option>
              ))}
            </select>
            <span style={{fontSize:11,color:'var(--muted)',marginTop:4}}>Quando um ticket exigir aprovação, ela sobe por esta cadeia (gestor → gestor do gestor). Sem gestor, o ticket é aprovado automaticamente.</span>
          </div>
          {form.role==='agent' && (
            <label style={{display:'flex',alignItems:'center',gap:10,fontSize:13,cursor:'pointer',padding:'10px 12px',background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:8}}>
              <button className={`toggle ${form.queueAdmin?'on':''}`} onClick={()=>set('queueAdmin',!form.queueAdmin)} />
              <div>
                <div style={{fontWeight:600}}>Administrador de filas</div>
                <div style={{fontSize:11,color:'var(--muted)'}}>Além de atender, pode customizar as próprias filas (SLA, descrição, modelo, aprovação).</div>
              </div>
            </label>
          )}
          <div style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:8,padding:'12px 14px',fontSize:12.5}}>
            <div style={{fontWeight:600,marginBottom:6,fontSize:13}}>Permissões</div>
            {form.role==='admin'    && <p style={{color:'var(--muted)',lineHeight:1.6}}>Acesso total ao sistema.</p>}
            {form.role==='agent'    && <p style={{color:'var(--muted)',lineHeight:1.6}}>Pode visualizar e atender tickets da fila atribuída{form.queueAdmin?', e customizar suas próprias filas':''}.</p>}
            {form.role==='approver' && <p style={{color:'var(--muted)',lineHeight:1.6}}>Acesso à fila de aprovações.</p>}
            {form.role==='requester'&& <p style={{color:'var(--muted)',lineHeight:1.6}}>Abre tickets e acompanha apenas os que criou. Sem acesso a gestão.</p>}
          </div>
        </div>
        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" style={{opacity:valid?1:0.5}} disabled={!valid} onClick={()=>{ const d={...form}; if(isEdit&&!form.password) delete d.password; onSave(d); }}>{isEdit?'Salvar Alterações':'Criar Usuário'}</button>
        </div>
      </div>
    </div>
  );
}

function QueueDescriptionEditor({ queue, onSave }) {
  const [value, setValue] = useState(queue.description || '');
  const [editing, setEditing] = useState(false);
  const dirty = value !== (queue.description || '');
  return (
    <div style={{display:'flex',flexDirection:'column',gap:6}}>
      <label className="form-label" style={{fontSize:11}}>Descrição (informativo na abertura do ticket)</label>
      <textarea
        className="form-textarea"
        style={{minHeight:editing||value?60:38,fontSize:12.5,transition:'min-height 0.2s'}}
        value={value}
        onFocus={()=>setEditing(true)}
        onChange={e=>setValue(e.target.value)}
        placeholder="Ex: Use esta fila para problemas de acesso. Anexe print do erro se possível."
      />
      {dirty && (
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-primary btn-sm" onClick={()=>{ onSave(value); setEditing(false); }}>Salvar descrição</button>

        </div>

function ApprovalFlowEditor({ queue, eligibleApprovers, onSave }) {
  // modo: 'managers' (padrão, cadeia de gestores) ou 'custom' (fluxo personalizado)
  const isCustom = Array.isArray(queue.approvalFlow) && queue.approvalFlow.length > 0;
  const [mode, setMode] = useState(isCustom ? 'custom' : 'managers');
  const [flow, setFlow] = useState(isCustom ? queue.approvalFlow : []);

  const saveManagers = (levels) => { setMode('managers'); onSave({ approvalLevels: levels, approvalFlow: null }); };
  const saveFlow = (newFlow) => { setFlow(newFlow); onSave({ approvalFlow: newFlow.length ? newFlow : null }); };

  const addManagerStep = () => saveFlow([...flow, { type:'manager' }]);
  const addFixedStep = () => saveFlow([...flow, { type:'fixed', approverId:'', approverName:'' }]);
  const removeStep = (i) => saveFlow(flow.filter((_,idx)=>idx!==i));
  const setFixedApprover = (i, approverId) => {
    const u = eligibleApprovers.find(a=>a.id===approverId);
    saveFlow(flow.map((s,idx)=> idx===i ? { ...s, approverId, approverName: u?.name||'' } : s));
  };
  const moveStep = (i, dir) => {
    const j = i+dir;
    if (j<0 || j>=flow.length) return;
    const copy = flow.slice();
    [copy[i],copy[j]] = [copy[j],copy[i]];
    saveFlow(copy);
  };

  return (
    <div style={{display:'flex',flexDirection:'column',gap:8,marginTop:4,padding:'12px',background:'var(--surface2)',borderRadius:8,border:'1px solid var(--border)'}}>
      <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
        <span className="form-label" style={{fontSize:11,margin:0}}>Tipo de aprovação:</span>
        <button className={`btn btn-sm ${mode==='managers'?'btn-primary':'btn-ghost'}`} onClick={()=>saveManagers(queue.approvalLevels||1)}>Cadeia de gestores</button>
        <button className={`btn btn-sm ${mode==='custom'?'btn-primary':'btn-ghost'}`} onClick={()=>{setMode('custom'); if(flow.length===0){ saveFlow([{type:'manager'}]); }}}>Fluxo personalizado</button>
      </div>

      {mode==='managers' && (
        <label style={{display:'flex',alignItems:'center',gap:8,fontSize:12.5}}>
          Níveis (sobe pela hierarquia do solicitante):
          <select className="form-select" style={{width:'auto',fontSize:12,padding:'5px 10px'}} value={queue.approvalLevels||1} onChange={e=>saveManagers(Number(e.target.value))}>
            <option value={1}>1 (gestor)</option>
            <option value={2}>2 (gestor + diretor)</option>
            <option value={3}>3 níveis</option>
            <option value={4}>4 níveis</option>
          </select>
        </label>
      )}

      {mode==='custom' && (
        <div style={{display:'flex',flexDirection:'column',gap:6}}>
          <span style={{fontSize:11,color:'var(--muted)'}}>Etapas em sequência (1ª → 2ª → 3ª...). Combine gestores e aprovadores fixos.</span>
          {flow.length===0 && <span style={{fontSize:12,color:'var(--muted)',padding:'6px 0'}}>Nenhuma etapa. Adicione abaixo.</span>}
          {flow.map((step,i)=>(
            <div key={i} style={{display:'flex',alignItems:'center',gap:8,background:'var(--surface)',border:'1px solid var(--border)',borderRadius:6,padding:'6px 10px'}}>
              <span style={{fontSize:11,fontWeight:700,color:'var(--accent)',minWidth:44}}>Etapa {i+1}</span>
              {step.type==='manager' ? (
                <span style={{flex:1,fontSize:12.5}}>👤 Gestor (sobe 1 nível na hierarquia)</span>
              ) : (
                <select className="form-select" style={{flex:1,fontSize:12,padding:'5px 8px'}} value={step.approverId||''} onChange={e=>setFixedApprover(i,e.target.value)}>
                  <option value="">Selecione o aprovador fixo</option>
                  {eligibleApprovers.map(a=><option key={a.id} value={a.id}>{a.name} ({ROLE_LABELS[a.role]})</option>)}
                </select>
              )}
              <button className="btn btn-ghost btn-sm" style={{padding:'2px 6px'}} onClick={()=>moveStep(i,-1)} disabled={i===0}>↑</button>
              <button className="btn btn-ghost btn-sm" style={{padding:'2px 6px'}} onClick={()=>moveStep(i,1)} disabled={i===flow.length-1}>↓</button>
              <button className="btn btn-sm" style={{padding:'2px 8px',background:'rgba(248,113,113,0.12)',color:'var(--danger)',border:'1px solid rgba(248,113,113,0.25)'}} onClick={()=>removeStep(i)}>✕</button>
            </div>
          ))}
          <div style={{display:'flex',gap:8,marginTop:4}}>
            <button className="btn btn-ghost btn-sm" onClick={addManagerStep}>+ Etapa de gestor</button>
            <button className="btn btn-ghost btn-sm" onClick={addFixedStep}>+ Aprovador fixo</button>
          </div>
        </div>
      )}
    </div>
  );
}

function QueueChecklistEditor({ queue, onSave }) {
  const enabled = Array.isArray(queue.checklistItems);
  const items = enabled ? queue.checklistItems : [];
  const [newItem, setNewItem] = useState('');

  const addItem = () => {
    const v = newItem.trim();
    if (!v || items.includes(v)) { setNewItem(''); return; }
    onSave([...items, v]);
    setNewItem('');
  };
  const removeItem = (i) => onSave(items.filter((_,idx)=>idx!==i));

  return (
    <div style={{display:'flex',flexDirection:'column',gap:8,marginTop:4}}>
      <label style={{display:'flex',alignItems:'center',gap:8,fontSize:12.5,cursor:'pointer'}}>
        <button className={`toggle ${enabled?'on':''}`} onClick={()=>onSave(enabled ? null : [])} />
        Checklist de itens (ex: materiais)
      </label>
      {enabled && (
        <div style={{padding:'12px',background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:8,display:'flex',flexDirection:'column',gap:8}}>
          <span style={{fontSize:11,color:'var(--muted)'}}>Cadastre os itens disponíveis. O solicitante escolhe quais quer e a quantidade ao abrir o ticket.</span>
          {items.length>0 && (
            <div style={{display:'flex',flexDirection:'column',gap:4}}>
              {items.map((it,i)=>(
                <div key={i} style={{display:'flex',alignItems:'center',gap:8,background:'var(--surface)',border:'1px solid var(--border)',borderRadius:6,padding:'5px 10px'}}>
                  <span style={{flex:1,fontSize:12.5}}>📦 {it}</span>
                  <button className="btn btn-sm" style={{padding:'2px 8px',background:'rgba(248,113,113,0.12)',color:'var(--danger)',border:'1px solid rgba(248,113,113,0.25)'}} onClick={()=>removeItem(i)}>✕</button>
                </div>
              ))}
            </div>
          )}
          <div style={{display:'flex',gap:8}}>
            <input className="form-input" style={{flex:1,fontSize:12.5,padding:'6px 10px'}} value={newItem} onChange={e=>setNewItem(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();addItem();}}} placeholder="Ex: Papel A4, Caneta azul..." />
            <button className="btn btn-ghost btn-sm" onClick={addItem}>+ Adicionar</button>
          </div>
        </div>
      )}
    </div>
  );
}

function QueueTemplateEditor({ queue, onSave }) {
  const [uploading, setUploading] = useState(false);
  const inputRef = useRef(null);
  const tpl = queue.template;

  const handleUpload = async (file) => {
    if (!file) return;
    if (file.size > 10*1024*1024) { alert('O modelo deve ter no máximo 10MB.'); return; }
    setUploading(true);
    try {
      const meta = await supa.uploadFile(file, `template-${queue.id}`);
      onSave(meta);
    } catch(e) {
      alert('Erro ao enviar modelo: ' + e.message);
    }
    setUploading(false);
  };

  return (
    <div style={{display:'flex',flexDirection:'column',gap:6,marginTop:4}}>
      <label className="form-label" style={{fontSize:11}}>Modelo para download (ex: termo p/ assinatura)</label>
      {tpl ? (
        <div style={{display:'flex',alignItems:'center',gap:10,background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:8,padding:'8px 12px'}}>
          <span style={{fontSize:18}}>📄</span>
          <a href={tpl.url} target="_blank" rel="noreferrer" style={{flex:1,fontSize:12.5,color:'var(--text)',textDecoration:'none',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{tpl.name}</a>
          <button className="btn btn-ghost btn-sm" onClick={()=>inputRef.current?.click()} disabled={uploading}>Trocar</button>
          <button className="btn btn-sm" style={{background:'rgba(248,113,113,0.12)',color:'var(--danger)',border:'1px solid rgba(248,113,113,0.25)'}} onClick={()=>onSave(null)}>Remover</button>
        </div>
      ) : (
        <div>
          <button className="btn btn-ghost btn-sm" onClick={()=>inputRef.current?.click()} disabled={uploading}>
            {uploading ? 'Enviando...' : '📎 Anexar modelo'}
          </button>
          <span style={{fontSize:11,color:'var(--muted)',marginLeft:8}}>O solicitante poderá baixar este arquivo no ticket.</span>
        </div>
      )}
      <input ref={inputRef} type="file" onChange={e=>{handleUpload(e.target.files[0]); e.target.value='';}} style={{display:'none'}} />
    </div>
  );
}

              <div className="settings-section-title">Credenciais EmailJS <a href="https://dashboard.emailjs.com" target="_blank" rel="noreferrer" style={{fontSize:11,color:'var(--accent)',marginLeft:12,fontWeight:400,textDecoration:'none'}}>→ Abrir dashboard ↗</a></div>
              {[
                {key:'ejsPublicKey',label:'Chave Pública (Public Key)',placeholder:'user_AbCdEf…',desc:'Em Account → API Keys'},
                {key:'ejsServiceId',label:'Service ID',placeholder:'service_xxxxxxx',desc:'Em Email Services'},

              {[
                {key:'ejsTicketTpl',   label:'Novo Ticket criado',       vars:'{{ticket_id}}, {{ticket_title}}, {{ticket_desc}}, {{queue_name}}, {{priority}}, {{status}}, {{agent_name}}, {{to_name}}, {{to_email}}'},
                {key:'ejsStatusTpl',   label:'Mudança de Status',         vars:'{{ticket_id}}, {{ticket_title}}, {{old_status}}, {{new_status}}, {{agent_name}}, {{to_name}}, {{to_email}}'},
                {key:'ejsApprovalTpl', label:'Decisão de Aprovação',      vars:'{{ticket_id}}, {{ticket_title}}, {{decision}}, {{approver_name}}, {{note}}, {{to_name}}, {{to_email}}'},
                {key:'ejsUserTpl',     label:'Boas-vindas — Novo Usuário',vars:'{{to_name}}, {{to_email}}, {{user_email}}, {{user_password}}, {{user_role}}, {{login_url}}'},
              ].map(f=>(
                <div key={f.key} className="settings-row" style={{flexDirection:'column',alignItems:'flex-start',gap:8}}>
                  <div style={{display:'flex',alignItems:'center',gap:12,width:'100%'}}>
                    <div className="settings-row-info"><div className="settings-row-label">{f.label}</div></div>
                    <input className="form-input" style={{width:240}} value={local[f.key]||''} onChange={e=>upd(f.key,e.target.value)} placeholder="template_xxxxxxx" />
                  </div>
                  <div style={{fontSize:11,color:'var(--muted)',background:'var(--surface2)',borderRadius:6,padding:'6px 10px',width:'100%'}}><strong style={{color:'var(--text)'}}>Variáveis:</strong> {f.vars}</div>
                </div>
              ))}
              <div className="settings-row"><div style={{flex:1}} /><button className="btn btn-primary" onClick={()=>onSave(local)}>Salvar</button></div>
            </div>
